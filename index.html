<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>Pokémon Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --font-display: 'Press Start 2P', monospace;
    --font-body: 'Courier New', monospace;
    --color-bg: #2a2a3e;
    --color-surface: #3d3d5c;
    --color-surface-light: #50507a;
    --color-border: #6a6a9a;
    --color-text: #f8f8f8;
    --color-text-muted: #b0b0d0;
    --color-primary: #4af0c0;
    --color-danger: #ff4466;
    --color-warning: #ffcc00;
    --color-info: #44aaff;
  }
  body {
    font-family: var(--font-body);
    background: #1a1a2e;
    color: var(--color-text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  #game-container {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16/10;
    position: relative;
    background: var(--color-bg);
    border: 3px solid var(--color-border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #ui-overlay button, #ui-overlay .clickable {
    pointer-events: auto;
  }
  .btn {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: bold;
    color: var(--color-text);
    background: var(--color-surface-light);
    border: 2px solid var(--color-border);
    border-radius: 4px;
    padding: 10px 16px;
    cursor: pointer;
    transition: all 120ms;
    text-transform: uppercase;
  }
  .btn:hover {
    background: var(--color-primary);
    color: #1a1a2e;
    transform: translateY(-2px);
  }
  .btn:active { transform: translateY(0); }
  .btn-danger { background: #663344; border-color: var(--color-danger); }
  .btn-danger:hover { background: var(--color-danger); color: #fff; }
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
    z-index: 100;
    gap: 20px;
  }
  .loading-text {
    font-size: 18px;
    color: var(--color-primary);
    text-shadow: 2px 2px 0 #000;
  }
  .loading-bar {
    width: 300px;
    height: 12px;
    background: var(--color-surface);
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid var(--color-border);
  }
  .loading-fill {
    height: 100%;
    background: var(--color-primary);
    width: 0%;
    transition: width 300ms;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--color-surface);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
   /* Móvil - adaptaciones */
  @media (max-width: 768px) {
    body {
      overflow: auto;
      min-height: auto;
    }
    
    #game-container {
      max-width: 100%;
      aspect-ratio: auto;
      height: auto;
      min-height: 100vh;
    }
    
    .btn {
      font-size: 12px;
      padding: 8px 12px;
    }
  }
</style>
</head>

// --- PokeAPI fetch ---
async function fetchPokemonData(id) {
  const resp = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
  if (!resp.ok) throw new Error(`Failed to fetch Pokémon ${id}`);
  const data = await resp.json();
  const types = data.types.map(t => t.type.name);
  const stats = {};
  data.stats.forEach(s => { stats[s.stat.name] = s.base_stat; });
  return {
    id: data.id,
    name: data.name,
    types,
    stats,
    spriteFront: data.sprites.front_default,
    spriteBack: data.sprites.back_default,
  };
}

async function loadSprite(url) {
  if (spriteCache[url]) return spriteCache[url];
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { spriteCache[url] = img; resolve(img); };
    img.onerror = () => { spriteCache[url] = null; resolve(null); };
    img.src = url;
  });
}

// --- Create a Pokémon instance ---
function createPokemon(baseData, level = 5, forceShiny = false) {
  const shiny = forceShiny || Math.random() < 1 / 110;
  const sb = shiny ? 1.08 : 1;
  const hp = Math.floor(((2 * baseData.stats.hp) * level) / 100) + level + 10;
  const atk = Math.round((Math.floor(((2 * baseData.stats.attack) * level) / 100) + 5) * sb);
  const def = Math.round((Math.floor(((2 * baseData.stats.defense) * level) / 100) + 5) * sb);
  const spAtk = Math.round((Math.floor(((2 * baseData.stats['special-attack']) * level) / 100) + 5) * sb);
  const spDef = Math.round((Math.floor(((2 * baseData.stats['special-defense']) * level) / 100) + 5) * sb);
  const spd = Math.round((Math.floor(((2 * baseData.stats.speed) * level) / 100) + 5) * sb);

  // Assign 4 moves based on types
  const moves = [];
  const typeMoves = baseData.types.flatMap(t => MOVES_BY_TYPE[t] || []);
  const normalMoves = MOVES_BY_TYPE.normal;
  const pool = [...new Set([...typeMoves, ...normalMoves])];
  // Pick 4 moves, ensuring at least 2 are not normal
  const nonNormal = pool.filter(m => MOVES[m].type !== 'normal' && MOVES[m].power > 0);
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  for (const m of shuffled) {
    if (moves.length >= 4) break;
    if (MOVES[m].power > 0) moves.push(m);
  }
  // Fill with normal moves if not enough
  while (moves.length < 4 && moves.length < pool.length) {
    const m = normalMoves[moves.length % normalMoves.length];
    if (!moves.includes(m)) moves.push(m);
  }
  while (moves.length < 4) moves.push('tackle');

  return {
    ...baseData,
    shiny,
    level,
    maxHP: hp,
    currentHP: hp,
    attack: atk,
    defense: def,
    spAttack: spAtk,
    spDefense: spDef,
    speed: spd,
    moves,
    movePP: moves.reduce((acc, m) => ({ ...acc, [m]: MOVES[m].pp }), {}),
    xp: 0,
    xpToNext: level * level * 8,
    status: null,
    // Animation properties
    displayHP: hp,
    hitFlash: 0,
    offsetX: 0,
    offsetY: 0,
    scale: 1,
    faintAlpha: 1,
    introOffset: 0,
  };
}

// --- Type effectiveness ---
function getTypeMultiplier(attackType, defenderTypes) {
  let multiplier = 1;
  const chart = TYPE_CHART[attackType];
  if (!chart) return 1;
  for (const defType of defenderTypes) {
    if (chart.immune.includes(defType)) return 0;
    if (chart.strong.includes(defType)) multiplier *= 0.5;
    if (chart.weak.includes(defType)) multiplier *= 2;
  }
  return multiplier;
}

// --- Damage calculation ---
function calculateDamage(attacker, defender, moveKey) {
  const move = MOVES[moveKey];
  if (!move || move.power === 0) return 0;
  const isPhysical = move.category === 'physical';
  const atkStat = isPhysical ? attacker.attack : attacker.spAttack;
  const defStat = isPhysical ? defender.defense : defender.spDefense;
  const typeMult = getTypeMultiplier(move.type, defender.types);
  const stab = attacker.types.includes(move.type) ? 1.5 : 1;
  const random = 0.85 + Math.random() * 0.15;
  const damage = Math.floor(
    (((2 * attacker.level) / 5 + 2) * move.power * (atkStat / defStat)) / 50 + 2
  ) * stab * typeMult * random;
  return { damage: Math.max(1, Math.floor(damage)), typeMult, effectiveness: typeMult };
}

// --- Audio ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}
function playTone(freq, duration, type = 'square', volume = 0.15) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function playHit() { playTone(150, 0.15, 'square', 0.2); setTimeout(() => playTone(100, 0.1, 'sawtooth', 0.15), 50); }
function playSelect() { playTone(660, 0.05, 'sine', 0.1); }

// --- Canvas utilities ---
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// --- Particles ---
function emitParticles(x, y, count, color, opts = {}) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * (opts.spread || 200),
      vy: -Math.random() * (opts.speed || 150) - 20,
      life: 0.4 + Math.random() * 0.3,
      maxLife: 0.7,
      color: Array.isArray(color) ? color[Math.floor(Math.random() * color.length)] : color,
      size: opts.size || 6,
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles(ctx) {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size * alpha, p.size * alpha);
  }
  ctx.globalAlpha = 1;
}

// --- Message system ---
function showMessage(msg, duration = 1500) {
  currentMessage = msg;
  messageTimer = duration;
}
function queueMessage(msg) {
  messageQueue.push(msg);
}

// --- Animation system ---
function runAnimation(anim) {
  animationQueue.push(anim);
}
function processAnimations(dt) {
  if (animationQueue.length === 0) return;
  const anim = animationQueue[0];
  anim.elapsed += dt;
  if (anim.update) anim.update(anim, dt);
  if (anim.elapsed >= anim.duration) {
    if (anim.onComplete) anim.onComplete();
    animationQueue.shift();
  }
}

// --- UI Drawing ---
const typeColors = {
  normal: '#A8A878', fire: '#F08030', water: '#6890F0', electric: '#F8D030',

  ground: '#E0C068', flying: '#A890F0', psychic: '#F85888', bug: '#A8B820',

};

function drawHealthBar(ctx, x, y, w, h, ratio) {
  ctx.fillStyle = '#000';
  roundRect(ctx, x - 2, y - 2, w + 4, h + 4, 4);
  ctx.fill();
  ctx.fillStyle = '#444';
  roundRect(ctx, x, y, w, h, 3);
  ctx.fill();
  const fillW = Math.max(0, w * ratio);
  let color = '#4af0c0';
  if (ratio < 0.25) color = '#ff4466';
  else if (ratio < 0.5) color = '#ffcc00';
  ctx.fillStyle = color;
  roundRect(ctx, x, y, fillW, h, 3);
  ctx.fill();
}

function drawInfoBox(ctx, pokemon, x, y, isPlayer) {
  const boxW = 240, boxH = 70;
  ctx.fillStyle = 'rgba(240, 240, 240, 0.95)';
  roundRect(ctx, x, y, boxW, boxH, 8);

function drawPokemonSprite(ctx, pokemon, x, y, isPlayer, scale = 1) {
  const url = isPlayer ? (pokemon.spriteBack || pokemon.spriteFront) : pokemon.spriteFront;
  const img = spriteCache[url];
  if (!img) return;
  const spriteScale = 2.2 * scale * pokemon.scale;
  const sw = img.width * spriteScale;
  const sh = img.height * spriteScale;
  const dx = x - sw / 2 + pokemon.offsetX;
  const dy = y - sh + pokemon.offsetY + 15;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x + pokemon.offsetX, y + 5, sw / 2.5, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  if (pokemon.hitFlash > 0) {
    ctx.filter = `brightness(${1 + pokemon.hitFlash * 3}) saturate(0)`;
  }
  ctx.globalAlpha = pokemon.faintAlpha;
  ctx.imageSmoothingEnabled = false;
  if (pokemon.shiny && pokemon.hitFlash <= 0) ctx.filter = 'hue-rotate(50deg) saturate(1.5) brightness(1.12)';
  ctx.drawImage(img, dx, dy, sw, sh);
  ctx.globalAlpha = 1;
  ctx.filter = 'none';
  if (pokemon.shiny && pokemon.faintAlpha > 0.4) {
    for (let i = 0; i < 4; i++) {
      const a = animTime * 1.6 + i * 1.57;
      const sx = x + pokemon.offsetX + Math.cos(a) * (sw / 2.1);
      const sy = dy + sh / 2 + Math.sin(a * 1.3) * (sh / 2.4);
      const tw = 0.5 + 0.5 * Math.sin(animTime * 5 + i);
      ctx.fillStyle = `rgba(255,236,150,${0.35 + tw * 0.55})`;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(a);
      const r = 3 + tw * 3;
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.3, -r * 0.3); ctx.lineTo(r, 0); ctx.lineTo(r * 0.3, r * 0.3);
      ctx.lineTo(0, r); ctx.lineTo(-r * 0.3, r * 0.3); ctx.lineTo(-r, 0); ctx.lineTo(-r * 0.3, -r * 0.3);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
}

function drawBattleScene(ctx) {
  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#5a8a3a');
  grad.addColorStop(0.5, '#6aaa4a');
  grad.addColorStop(0.5, '#d4a76a');
  grad.addColorStop(1, '#c4955a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Sky gradient (top half)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  skyGrad.addColorStop(0, '#4a6a9a');
  skyGrad.addColorStop(1, '#7a9aca');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.5);

  // Ground platform for wild pokemon (only if wild pokemon exists)
  if (wildPokemon) {
    ctx.fillStyle = 'rgba(180, 160, 100, 0.5)';
    ctx.beginPath();
    ctx.ellipse(W * 0.72, H * 0.54, 95, 20, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ground platform for player pokemon
  const playerMon0 = player.party[player.activeIndex];
  if (playerMon0 && playerMon0.currentHP > 0) {
    ctx.fillStyle = 'rgba(180, 160, 100, 0.5)';
    ctx.beginPath();
    ctx.ellipse(W * 0.25, H * 0.80, 95, 20, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Apply screen shake
  ctx.save();
  if (shakeAmount > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shakeAmount,
      (Math.random() - 0.5) * shakeAmount
    );
  }

  // Draw wild pokemon
  if (wildPokemon) {
    drawPokemonSprite(ctx, wildPokemon, W * 0.72, H * 0.54, false);
    drawInfoBox(ctx, wildPokemon, W * 0.52, H * 0.05, false);
  }

  // Draw player pokemon
  const playerMon = player.party[player.activeIndex];
  if (playerMon && playerMon.currentHP > 0) {
    drawPokemonSprite(ctx, playerMon, W * 0.25, H * 0.80, true);
    drawInfoBox(ctx, playerMon, W * 0.52, H * 0.55, true);
  }

  drawParticles(ctx);

  ctx.restore();

  // Flash overlay
  if (flashAmount > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flashAmount})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Message box
  drawMessageBox(ctx);

  // Battle menu
  if (gameState === 'battle' && awaitingInput && !moveMenuOpen && !itemMenuOpen && !pokemonMenuOpen) {
    drawBattleMenu(ctx);
  }
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let yy = y;
  for (const word of words) {
    const testLine = line + word + ' ';
    if (ctx.measureText(testLine).width > maxWidth && line !== '') {
      ctx.fillText(line, x, yy);
      line = word + ' ';
      yy += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, yy);
}

// --- Mouse handling ---
let mouseX = 0, mouseY = 0;
function getHoveredButton(buttons) {
  if (!buttons) return null;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = mouseX * scaleX;
  const my = mouseY * scaleY;
  for (const btn of buttons) {
    if (mx >= btn.x && mx <= btn.x + (btn.w || 105) && my >= btn.y && my <= btn.y + (btn.h || 30)) {
      return btn;
    }
  }
  return null;
}

// --- Battle Logic (turn engine) ---
let awaitingInput = false;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function animateAsync(opts) {
  return new Promise(resolve => {
    runAnimation({ ...opts, elapsed: 0, onComplete: resolve });
  });
}

async function say(text, ms = 1300) {
  currentMessage = text;
  messageTimer = ms;
  await sleep(ms);
}

function endOfTurn() {
  currentMessage = '';
  messageTimer = 0;
  moveMenuOpen = false;
  itemMenuOpen = false;
  pokemonMenuOpen = false;
  awaitingInput = true;
}

function pickWildMove() {
  const damaging = wildPokemon.moves.filter(m => wildPokemon.movePP[m] > 0 && MOVES[m].power > 0);
  const any = wildPokemon.moves.filter(m => wildPokemon.movePP[m] > 0);
  const pool = damaging.length ? damaging : any;
  if (!pool.length) return 'tackle';
  return pool[Math.floor(Math.random() * pool.length)];
}

// --- Wild encounter ---
async function startWildEncounter() {
  gameState = 'battle';
  awaitingInput = false;
  moveMenuOpen = false;
  itemMenuOpen = false;
  pokemonMenuOpen = false;
  currentMessage = '';
  messageTimer = 0;
  messageQueue = [];
  particles = [];
  animationQueue = [];
  shakeAmount = 0;
  flashAmount = 0;

  const wildId = WILD_POOL[Math.floor(Math.random() * WILD_POOL.length)];
  const mon = player.party[player.activeIndex];
  const wildLevel = Math.max(2, mon.level + Math.floor(Math.random() * 5) - 2);

  try {
    const data = await fetchPokemonData(wildId);
    await loadSprite(data.spriteFront);
    wildPokemon = createPokemon(data, wildLevel);
  } catch (e) {
    await say('Conexión lenta, reintentando...', 1000);
    return startWildEncounter();
  }

  mon.faintAlpha = 1;
  mon.offsetX = 0;
  mon.offsetY = 0;
  mon.hitFlash = 0;
  mon.displayHP = mon.currentHP;

  wildPokemon.offsetX = 280;
  await animateAsync({
    duration: 0.45,
    update: (a) => { wildPokemon.offsetX = 280 * (1 - Math.min(1, a.elapsed / 0.45)); },
  });
  wildPokemon.offsetX = 0;

  await say(`¡Un ${wildPokemon.name.toUpperCase()} salvaje apareció!`, 1600);
  await say(`¡Adelante, ${mon.name.toUpperCase()}!`, 1200);
  endOfTurn();
}

// --- Single move execution ---
async function performMove(moveKey, isPlayer) {
  const attacker = isPlayer ? player.party[player.activeIndex] : wildPokemon;
  const defender = isPlayer ? wildPokemon : player.party[player.activeIndex];
  const move = MOVES[moveKey] || MOVES.tackle;

  if (attacker.movePP[moveKey] === undefined) attacker.movePP[moveKey] = move.pp;
  if (attacker.movePP[moveKey] > 0) attacker.movePP[moveKey]--;

  await say(`¡${attacker.name.toUpperCase()} usó ${move.name}!`, 1000);

  if (move.power === 0) {
    await say('¡Pero no pasó nada!', 900);
    return;
  }

  const result = calculateDamage(attacker, defender, moveKey);

  // Lunge animation
  const dir = isPlayer ? 1 : -1;
  await animateAsync({
    duration: 0.28,
    update: (a) => {
      attacker.offsetX = Math.sin(Math.min(1, a.elapsed / 0.28) * Math.PI) * 40 * dir;
    },
  });
  attacker.offsetX = 0;

  if (result.effectiveness === 0) {
    await say(`¡No afecta a ${defender.name.toUpperCase()}!`, 1200);
    return;
  }

  defender.hitFlash = 1;
  shakeAmount = result.effectiveness > 1 ? 15 : 8;
  flashAmount = 0.3;
  playHit();
  if (result.effectiveness > 1) playCritical();

  const px = isPlayer ? W * 0.72 : W * 0.25;
  const py = isPlayer ? H * 0.42 : H * 0.68;
  emitParticles(px, py, 15, ['#ff4466', '#ffaa22', '#fff'], { spread: 250, speed: 200 });

  const from = defender.displayHP;
  const target = Math.max(0, defender.currentHP - result.damage);
  await animateAsync({
    duration: 0.5,
    update: (a) => {
      const t = Math.min(1, a.elapsed / 0.5);
      defender.displayHP = from + (target - from) * t;
      defender.hitFlash = Math.max(0, 1 - t * 2);
    },
  });
  defender.currentHP = target;
  defender.displayHP = target;
  defender.hitFlash = 0;
  shakeAmount = 0;
  flashAmount = 0;

  if (result.effectiveness > 1) await say('¡Es supereficaz!', 1000);
  else if (result.effectiveness < 1) await say('No es muy eficaz...', 1000);
}

// --- Fainting ---
async function faintAnim(mon) {
  playFaint();
  await animateAsync({
    duration: 0.7,
    update: (a) => {
      const t = Math.min(1, a.elapsed / 0.7);
      mon.faintAlpha = 1 - t;
      mon.offsetY = t * 50;
    },
  });
  mon.faintAlpha = 0;
}

async function awardXP() {
  const mon = player.party[player.activeIndex];
  const xpGain = Math.floor((wildPokemon.level * 12 + 20) * (player.items.luckyegg ? 1.5 : 1));
  mon.xp += xpGain;
  await say(`¡${mon.name.toUpperCase()} ganó ${xpGain} de experiencia!`, 1300);

  while (mon.xp >= mon.xpToNext) {
    mon.xp -= mon.xpToNext;
    mon.level++;
    mon.xpToNext = mon.level * mon.level * 8;
    const oldMax = mon.maxHP;
    mon.maxHP = Math.floor(((2 * mon.stats.hp) * mon.level) / 100) + mon.level + 10;
    mon.attack = Math.floor(((2 * mon.stats.attack) * mon.level) / 100) + 5;
    mon.defense = Math.floor(((2 * mon.stats.defense) * mon.level) / 100) + 5;
    mon.spAttack = Math.floor(((2 * mon.stats['special-attack']) * mon.level) / 100) + 5;
    mon.spDefense = Math.floor(((2 * mon.stats['special-defense']) * mon.level) / 100) + 5;
    mon.speed = Math.floor(((2 * mon.stats.speed) * mon.level) / 100) + 5;
    mon.currentHP += (mon.maxHP - oldMax);
    mon.displayHP = mon.currentHP;
    playLevelUp();
    emitParticles(W * 0.25, H * 0.68, 24, ['#ffcc00', '#fff', '#4af0c0'], { spread: 220, speed: 180 });
    await say(`¡${mon.name.toUpperCase()} subió al nivel ${mon.level}!`, 1500);
    const le = LEVEL_EVOS[mon.id];
    if (le && mon.level >= le.lv && !pendingEvos.some(e => e.idx === player.activeIndex)) {
      pendingEvos.push({ idx: player.activeIndex, to: le.to });
    }
  }
}

async function handleWildFaint() {
  await faintAnim(wildPokemon);

  if (battleKind === 'trainer') {
    await say(`¡El ${wildPokemon.name.toUpperCase()} de ${currentTrainer.def.name} se debilitó!`, 1500);
  } else {
    await say(`¡${wildPokemon.name.toUpperCase()} salvaje se debilitó!`, 1500);
  }

  player.wins++;
  questProgress('wins');
  if (battleKind === 'wild') {
    const cash = (24 + wildPokemon.level * 8) * (player.items.amulet ? 2 : 1);
    player.money += cash;
    await say(`Encontraste ${cash}₽ tras el combate.`, 1300);
  }
  await awardXP();
  await sleep(200);

  if (!player.party.some(p => p.currentHP > 0)) { await whiteout(); return; }

  if (battleKind === 'trainer') {
    currentTrainer.index++;
    if (currentTrainer.index < currentTrainer.team.length) {
      wildPokemon = currentTrainer.team[currentTrainer.index];
      wildPokemon.offsetX = 280;
      await say(`¡${currentTrainer.def.title} ${currentTrainer.def.name} saca a ${wildPokemon.name.toUpperCase()}!`, 1500);
      await animateAsync({ duration: 0.45, update: (a) => { wildPokemon.offsetX = 280 * (1 - Math.min(1, a.elapsed / 0.45)); } });
      wildPokemon.offsetX = 0;
      endOfTurn();
      return;
    }
    await onTrainerDefeated();
    return;
  }

  await returnToOverworld();
}

// Returns true if the battle continues
async function handlePlayerFaint() {
  const mon = player.party[player.activeIndex];
  await faintAnim(mon);
  await say(`¡${mon.name.toUpperCase()} se debilitó!`, 1500);
  const next = player.party.findIndex(p => p.currentHP > 0);
  if (next === -1) {
    await whiteout();
    return false;
  }
  player.activeIndex = next;
  const nm = player.party[next];
  nm.faintAlpha = 1;
  nm.offsetY = 0;
  nm.offsetX = 0;
  nm.displayHP = nm.currentHP;
  await say(`¡Adelante, ${nm.name.toUpperCase()}!`, 1200);
  return true;
}

// --- Turn resolution: both sides act, ordered by speed ---
async function resolveTurn(playerMove) {
  awaitingInput = false;
  moveMenuOpen = false;
  itemMenuOpen = false;
  pokemonMenuOpen = false;

  const pm = player.party[player.activeIndex];
  const wildMove = pickWildMove();
  const playerFirst = pm.speed >= wildPokemon.speed;
  const order = playerFirst
    ? [[playerMove, true], [wildMove, false]]
    : [[wildMove, false], [playerMove, true]];

  for (const [mv, isP] of order) {
    if (gameState !== 'battle') return;
    const atk = isP ? player.party[player.activeIndex] : wildPokemon;
    const def = isP ? wildPokemon : player.party[player.activeIndex];
    if (atk.currentHP <= 0 || def.currentHP <= 0) continue;

    await performMove(mv, isP);

    if (wildPokemon.currentHP <= 0) { await handleWildFaint(); return; }
    if (player.party[player.activeIndex].currentHP <= 0) {
      const cont = await handlePlayerFaint();
      if (!cont) return;
      break; // the replacement does not attack this turn
    }
  }
  endOfTurn();
}

// --- Turn resolution for non-attack actions ---
async function resolveTurnWithAction(actionFn) {
  awaitingInput = false;
  moveMenuOpen = false;
  itemMenuOpen = false;
  pokemonMenuOpen = false;

  const outcome = await actionFn();
  if (outcome === 'end' || gameState !== 'battle') return;
  if (outcome === false) { endOfTurn(); return; }
  if (!wildPokemon || wildPokemon.currentHP <= 0) { endOfTurn(); return; }

  await performMove(pickWildMove(), false);

  if (player.party[player.activeIndex].currentHP <= 0) {
    const cont = await handlePlayerFaint();
    if (!cont) return;
  }
  endOfTurn();
}

// --- Player actions ---
function playerUseMove(moveKey) {
  const mon = player.party[player.activeIndex];
  if (mon.movePP[moveKey] <= 0) {
    moveMenuOpen = false;
    resolveTurnWithAction(async () => {
      await say(`¡No quedan PP para ${MOVES[moveKey].name}!`, 1200);
      return false;
    });
    return;
  }
  resolveTurn(moveKey);
}

async function potionAction() {
  const mon = player.party[player.activeIndex];
  if (player.potions <= 0) { await say('¡No tienes pociones!', 1200); return false; }
  if (mon.currentHP >= mon.maxHP) { await say('¡Ya tiene los PS al máximo!', 1200); return false; }

  player.potions--;
  const target = Math.min(mon.maxHP, mon.currentHP + Math.floor(mon.maxHP * 0.5));
  const healed = target - mon.currentHP;
  const from = mon.displayHP;
  mon.currentHP = target;

  await animateAsync({
    duration: 0.5,
    update: (a) => {
      const t = Math.min(1, a.elapsed / 0.5);
      mon.displayHP = from + (target - from) * t;
    },
  });
  mon.displayHP = target;
  emitParticles(W * 0.25, H * 0.68, 20, ['#4af0c0', '#aaffcc'], { spread: 200, speed: 150 });
  playLevelUp();
  await say(`¡${mon.name.toUpperCase()} recuperó ${healed} PS!`, 1300);
  return true;
}

async function ballAction() {
  if (battleKind === 'trainer') { await say('¡No puedes capturar los Pokémon de otro entrenador!', 1600); return false; }
  if (player.pokeballs <= 0) { await say('¡No tienes Poké Balls!', 1200); return false; }

  player.pokeballs--;
  playThrow();
  await say('¡Lanzaste una Poké Ball!', 1200);

  const hpFactor = 1 - wildPokemon.currentHP / wildPokemon.maxHP;
  const rate = Math.max(12, Math.min(92, 42 + hpFactor * 48 - wildPokemon.level * 1.2));
  const caught = Math.random() * 100 < rate;
  const shakes = caught ? 3 : Math.floor(Math.random() * 3);

  for (let i = 0; i < shakes; i++) {
    shakeAmount = 6;
    playTone(320, 0.09, 'sine', 0.12);
    await sleep(180);
    shakeAmount = 0;
    await sleep(220);
  }

  if (caught) {
    playCatch();
    if (player.party.length < 6) {
      wildPokemon.faintAlpha = 0;
      wildPokemon.displayHP = wildPokemon.currentHP;
      player.party.push(wildPokemon);
      player.caught[wildPokemon.id] = true;
      questProgress('catch');
      await say(`¡${wildPokemon.name.toUpperCase()} fue capturado!`, 1800);
    } else {
      await say('¡Tu equipo está lleno! Se escapó...', 1600);
    }
    await returnToOverworld();
    return 'end';
  }

  await say(`¡Oh no! ¡${wildPokemon.name.toUpperCase()} escapó de la Ball!`, 1400);
  return true;
}

async function switchAction(index) {
  const mon = player.party[index];
  if (index === player.activeIndex) { await say('¡Ese Pokémon ya está en combate!', 1200); return false; }
  if (mon.currentHP <= 0) { await say('¡Ese Pokémon está debilitado!', 1200); return false; }

  player.activeIndex = index;
  mon.faintAlpha = 1;
  mon.offsetX = 0;
  mon.offsetY = 0;
  mon.hitFlash = 0;
  mon.displayHP = mon.currentHP;
  await say(`¡Adelante, ${mon.name.toUpperCase()}!`, 1200);
  return true;
}

function usePotion() { resolveTurnWithAction(potionAction); }
function usePokeball() { resolveTurnWithAction(ballAction); }
function switchPokemon(index) { resolveTurnWithAction(() => switchAction(index)); }

async function fleeBattle() {
  awaitingInput = false;
  moveMenuOpen = false;
  itemMenuOpen = false;
  pokemonMenuOpen = false;

  if (battleKind === 'trainer') {
    await say('¡No puedes huir de un combate contra un entrenador!', 1600);
    endOfTurn();
    return;
  }

  const mon = player.party[player.activeIndex];
  const escaped = mon.speed >= wildPokemon.speed || Math.random() < 0.65;

  if (!escaped) {
    await say('¡No pudiste escapar!', 1200);
    await performMove(pickWildMove(), false);
    if (player.party[player.activeIndex].currentHP <= 0) {
      const cont = await handlePlayerFaint();
      if (!cont) return;
    }
    endOfTurn();
    return;
  }

  await say('¡Escapaste con seguridad!', 1200);
  await returnToOverworld();
}

  if (it.key === 'potion') player.potions += 1;
  else if (it.key === 'ball') player.pokeballs += 1;
  else if (it.key === 'berry') player.berries += 1;
  else if (it.key === 'amulet' || it.key === 'luckyegg') { player.items[it.key] = true; }
  else if (it.key === 'egg') {
    player.eggs.push({ steps: 220, total: 220 });
  }
  else player.stones[it.key] = (player.stones[it.key] || 0) + 1;
  playCatch();
  shopMessage = `Compraste ${it.name} por ${it.price}₽.`;
  shopMsgTimer = 2;
}

// --- Generador de mapas grandes (determinista por semilla) ---
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function genZoneMap(z, zoneIndex) {
  const rnd = mulberry32(z.seed + zoneIndex);
  const ri = (n) => Math.floor(rnd() * n);
  const g = [];
  for (let y = 0; y < ROWS; y++) {
    const row = [];
    for (let x = 0; x < COLS; x++) row.push((x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) ? '#' : '.');
    g.push(row);
  }

  const blob = (ch, count, minS, maxS) => {
    for (let i = 0; i < count; i++) {
      const w = minS + ri(maxS - minS + 1), h = minS + ri(maxS - minS + 1);
      const x0 = 2 + ri(Math.max(1, COLS - 4 - w)), y0 = 2 + ri(Math.max(1, ROWS - 4 - h));
      for (let y = y0; y < Math.min(ROWS - 2, y0 + h); y++)
        for (let x = x0; x < Math.min(COLS - 2, x0 + w); x++)
          if (g[y][x] === '.') g[y][x] = ch;
    }
  };

  blob('#', 30, 2, 4);
  if (z.pal.water) blob('~', 9, 2, 5);

  // Pasillos garantizados: anillo exterior + dos ejes centrales
  for (let x = 1; x < COLS - 1; x++) { g[1][x] = '.'; g[ROWS - 2][x] = '.'; }
  for (let y = 1; y < ROWS - 1; y++) { g[y][1] = '.'; g[y][COLS - 2] = '.'; }
  const midY = Math.floor(ROWS / 2), midX = Math.floor(COLS / 2);
  for (let x = 1; x < COLS - 1; x++) if (g[midY][x] === '#') g[midY][x] = '.';
  for (let y = 1; y < ROWS - 1; y++) if (g[y][midX] === '#') g[y][midX] = '.';

  // Zona alcanzable desde la entrada
  const walkable = (x, y) => g[y] && g[y][x] && g[y][x] !== '#' && g[y][x] !== '~';
  const seen = new Set(['1,1']);
  const q = [[1, 1]];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
      if (!seen.has(k) && walkable(nx, ny)) { seen.add(k); q.push([nx, ny]); }
    }
  }

  // Mucha hierba alta
  for (let i = 0; i < 34; i++) {
    const w = 2 + ri(5), h = 2 + ri(4);
    const x0 = 2 + ri(Math.max(1, COLS - 4 - w)), y0 = 2 + ri(Math.max(1, ROWS - 4 - h));
    for (let y = y0; y < Math.min(ROWS - 2, y0 + h); y++)
      for (let x = x0; x < Math.min(COLS - 2, x0 + w); x++)
        if (g[y][x] === '.' && seen.has(x + ',' + y) && !(y <= 2 && x <= 5)) g[y][x] = '"';
  }

  // Árboles con bayas: muros accesibles desde una casilla caminable
  let berries = 0;
  const berryTarget = 14;
  for (let y = 2; y < ROWS - 2 && berries < berryTarget; y++) {
    for (let x = 2; x < COLS - 2 && berries < berryTarget; x++) {
      if (g[y][x] !== '#') continue;
      if ((x * 7 + y * 13 + (z.seed % 11)) % 5 !== 0) continue;
      let ok = false;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (seen.has((x + dx) + ',' + (y + dy))) ok = true;
      if (!ok) continue;
      g[y][x] = 'F'; berries++;
    }
  }

  // Casillas fijas
  const force = (x, y, ch) => { g[y][x] = ch; };
  if (zoneIndex > 0) force(1, 1, 'g');
  force(4, 1, 'H');
  force(7, 1, 'M');
  force(10, 1, 'Q');
  force(13, 1, 'R');
  g[1][12] = '.'; g[1][14] = '.';
  g[1][9] = '.'; g[1][11] = '.';
  g[1][6] = '.'; g[1][8] = '.';
  force(COLS - 2, ROWS - 2, 'G');
  force(COLS - 5, ROWS - 2, 'L');

  // Reparto del resto sobre suelo libre y alcanzable
  const used = [[1, 1], [4, 1], [COLS - 2, ROWS - 2], [COLS - 5, ROWS - 2]];
  const cands = [];
  for (const k of seen) {
    const [x, y] = k.split(',').map(Number);
    if (g[y][x] !== '.') continue;
    if (x < 2 || y < 2 || x > COLS - 3 || y > ROWS - 3) continue;
    let nb = 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (walkable(x + dx, y + dy)) nb++;
    if (nb < 3) continue;
    cands.push([x, y]);
  }
  // mezcla determinista
  for (let i = cands.length - 1; i > 0; i--) { const j = ri(i + 1); const t = cands[i]; cands[i] = cands[j]; cands[j] = t; }

  const place = (ch, count, minDist) => {
    let done = 0;
    for (const c of cands) {
      if (done >= count) break;
      if (g[c[1]][c[0]] !== '.') continue;
      if (used.some(u => Math.abs(u[0] - c[0]) + Math.abs(u[1] - c[1]) < minDist)) continue;
      g[c[1]][c[0]] = ch; used.push(c); done++;
    }
  };

  place('T', z.trainers.length, 7);
  place('S', z.stones.length, 6);
  place('P', 4, 5);
  place('B', 4, 5);
  place('H', 1, 10);

  return g.map(r => r.join(''));
}

// --- Clima ---
function updateWeather(dt) {
  const w = zoneDef().weather;
  if (!w) { if (weatherParts.length) weatherParts = []; return; }
  const target = w === 'snow' ? 80 : w === 'ash' ? 60 : 130;
  while (weatherParts.length < target) {
    weatherParts.push({
      x: Math.random() * VIEW_W, y: MAP_Y + Math.random() * VIEW_H,
      s: 0.6 + Math.random() * 0.8, ph: Math.random() * 6.3,
    });
  }
  const vy = w === 'snow' ? 40 : w === 'ash' ? 30 : 420;
  const vx = w === 'snow' ? 14 : w === 'ash' ? 10 : 70;
  for (const pp of weatherParts) {
    pp.y += vy * pp.s * dt;
    pp.x += vx * pp.s * dt * (w === 'rain' ? 1 : Math.sin(owTime * 1.2 + pp.ph));
    if (pp.y > MAP_Y + VIEW_H) { pp.y = MAP_Y - 8; pp.x = Math.random() * VIEW_W; }
    if (pp.x > VIEW_W) pp.x -= VIEW_W;
    if (pp.x < 0) pp.x += VIEW_W;
  }
}

function drawWeather(ctx) {
  const w = zoneDef().weather;
  if (!w || !weatherParts.length) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, MAP_Y, VIEW_W, VIEW_H); ctx.clip();
  if (w === 'rain') {
    ctx.strokeStyle = 'rgba(180,215,255,0.55)';
    ctx.lineWidth = 1.4;
    for (const pp of weatherParts) {
      ctx.beginPath(); ctx.moveTo(pp.x, pp.y); ctx.lineTo(pp.x - 3, pp.y + 11 * pp.s); ctx.stroke();
    }
  } else if (w === 'snow') {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (const pp of weatherParts) { ctx.beginPath(); ctx.arc(pp.x, pp.y, 1.6 * pp.s, 0, Math.PI * 2); ctx.fill(); }
  } else {
    for (const pp of weatherParts) {
      ctx.fillStyle = `rgba(255,${120 + Math.floor(pp.s * 60)},60,0.5)`;
      ctx.beginPath(); ctx.arc(pp.x, pp.y, 1.8 * pp.s, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function weatherName() {
  const w = zoneDef().weather;
  return w === 'rain' ? 'Lluvia' : w === 'snow' ? 'Nieve' : w === 'ash' ? 'Ceniza' : 'Despejado';
}

// --- Ciclo día/noche ---
function dayPhase() {
  const t = (dayTime % DAY_LENGTH) / DAY_LENGTH;
  if (t < 0.42) return { name: 'Día', tint: null };
  if (t < 0.52) return { name: 'Atardecer', tint: 'rgba(255,140,60,0.20)' };
  if (t < 0.90) return { name: 'Noche', tint: 'rgba(20,28,80,0.42)' };
  return { name: 'Amanecer', tint: 'rgba(255,190,120,0.16)' };
}
function isNight() { return dayPhase().name === 'Noche'; }

// --- Cámara ---
function updateCamera(instant) {
  const p = heroPixel();
  let tx = p.x + TILE / 2 - VIEW_W / 2;
  let ty = (p.y - MAP_Y) + TILE / 2 - VIEW_H / 2;
  tx = Math.max(0, Math.min(COLS * TILE - VIEW_W, tx));
  ty = Math.max(0, Math.min(ROWS * TILE - VIEW_H, ty));
  if (instant) { cam.x = tx; cam.y = ty; }
  else { cam.x += (tx - cam.x) * 0.2; cam.y += (ty - cam.y) * 0.2; }
}

function buildWorld() {
  world = ZONES.map((z, zi) => {
    z.map = genZoneMap(z, zi);
    const objects = {};
    let tIdx = 0, sIdx = 0;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const c = z.map[y][x];
        if (c === 'T') { objects[x + ',' + y] = { kind: 'trainer', idx: tIdx++ }; }
        else if (c === 'L') { objects[x + ',' + y] = { kind: 'leader' }; }
        else if (c === 'S') { objects[x + ',' + y] = { kind: 'stone', stone: z.stones[sIdx++] || z.stones[0] }; }
        else if (c === 'P') { objects[x + ',' + y] = { kind: 'potion' }; }
        else if (c === 'B') { objects[x + ',' + y] = { kind: 'ball' }; }
      }
    }
    return { leaderDefeated: false, trainersDefeated: {}, taken: {}, objects };
  });
}

function zoneDef() { return ZONES[currentZone]; }
function zoneState() { return world[currentZone]; }
function tileAt(x, y) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return '#';
  return zoneDef().map[y][x];
}
function objAt(x, y) { return zoneState().objects[x + ',' + y]; }

function findTile(ch) {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (zoneDef().map[y][x] === ch) return { x, y };
  return null;
}

function isSolid(x, y) {
  const c = tileAt(x, y);
  if (c === '~') return !(riding && canSurf());
  if (c === '#' || c === 'F' || c === 'M' || c === 'Q' || c === 'R') return true;
  const o = objAt(x, y);
  if (o && (o.kind === 'trainer' || o.kind === 'leader')) return true;
  return false;
}

async function owSay(text, ms = 1500) {
  owMessage = text;
  owMsgTimer = ms;
  await sleep(ms);
  owMessage = '';
  owMsgTimer = 0;
}

// --- Mapa y viaje rápido ---
let mapOpen = false;

function zoneReachable(i) {
  if (i === 0) return true;
  return !!(world[i - 1] && world[i - 1].leaderDefeated);
}

async function warpTo(index) {
  if (index === currentZone || !zoneReachable(index)) return;
  mapOpen = false;
  owLocked = true;
  await fadeOut();
  currentZone = index;
  const h = findTile('H');
  const spot = h ? { x: h.x + 1, y: h.y } : { x: 1, y: 1 };
  hero.x = spot.x; hero.y = spot.y;
  hero.fromX = hero.x; hero.fromY = hero.y; hero.prevX = hero.x; hero.prevY = hero.y;
  hero.moving = false; hero.t = 1; hero.dir = 'down';
  updateCamera(true);
  await fadeIn();
  await owSay(`Viajaste a ${zoneDef().name}.`, 1800);
  owLocked = false;
}

      ctx.fillStyle = col;
      ctx.fillRect(mx + x * sc, my + y * sc, sc, sc);
    }
  }
  const pts = [['M', '#7ab8e8'], ['Q', '#ffd24a'], ['R', '#c878f0'], ['H', '#ffffff'], ['S', '#f0a0ff'], ['G', zs.leaderDefeated ? '#4af0c0' : '#e06060']];
  for (const [ch, col] of pts) {

    const reach = zoneReachable(i);
    const cur = i === currentZone;
    const b = { action: 'warp', zone: i, x: 40, y: 84 + i * 62, w: 360, h: 52, enabled: reach && !cur };
    btns.push(b);
    const hov = getHoveredButton([b]) === b && b.enabled;
    ctx.fillStyle = cur ? 'rgba(74,240,192,0.16)' : hov ? 'rgba(74,240,192,0.28)' : reach ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.03)';
    roundRect(ctx, b.x, b.y, b.w, b.h, 8); ctx.fill();
    ctx.strokeStyle = cur ? '#4af0c0' : reach ? '#4a5270' : '#2e3346';
    ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = reach ? '#f4f4f4' : '#5d6478';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(`${i + 1}. ${z.name}`, b.x + 14, b.y + 18);
    ctx.font = '10px "Courier New", monospace';
    ctx.fillStyle = reach ? '#9aa0b4' : '#4d5467';
    const st = world[i];
    const info = !reach ? 'Bloqueada — derrota al líder anterior'
      : `Nv ${z.levels[0]}-${z.levels[1]} · ${st && st.leaderDefeated ? 'medalla conseguida' : 'líder pendiente'}${st && st.rivalDefeated ? ' · rival vencido' : ''}`;
    ctx.fillText(info, b.x + 14, b.y + 36);
    if (cur) {
      ctx.fillStyle = '#4af0c0';
      ctx.font = 'bold 10px "Courier New", monospace';
      ctx.textAlign = 'right';
      ctx.fillText('AQUÍ', b.x + b.w - 14, b.y + 26);
      ctx.textAlign = 'left';
    }
  });

  owButtons = btns;
}

// --- Hierba brillante ---
let sparkleTimer = 12;
function sparklePatch() {
  const st = zoneState();
  return st.sparkle || null;
}

function updateSparkle(dt) {
  const st = zoneState();
  sparkleTimer -= dt;
  if (sparkleTimer > 0) return;
  sparkleTimer = 45 + Math.random() * 40;
  const spots = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (tileAt(x, y) === '"') spots.push({ x, y });
  if (!spots.length) return;
  st.sparkle = spots[Math.floor(Math.random() * spots.length)];
}

function drawSparklePatch(ctx) {
  const sp = sparklePatch();
  if (!sp) return;
  const px = sp.x * TILE, py = sp.y * TILE + MAP_Y;
  const pulse = 0.5 + 0.5 * Math.sin(owTime * 4);
  ctx.fillStyle = `rgba(255,236,150,${0.18 + pulse * 0.22})`;
  ctx.fillRect(px, py, TILE, TILE);
  for (let i = 0; i < 5; i++) {
    const a = owTime * 1.5 + i * 1.26;
    const sx = px + TILE / 2 + Math.cos(a) * 16;
    const sy = py + TILE / 2 + Math.sin(a * 1.4) * 14;
    const tw = 0.5 + 0.5 * Math.sin(owTime * 6 + i * 2);
    ctx.fillStyle = `rgba(255,255,210,${0.4 + tw * 0.6})`;
    ctx.beginPath(); ctx.arc(sx, sy, 1.5 + tw * 2, 0, Math.PI * 2); ctx.fill();
  }
}

// --- Huevos Pokémon ---
function tickEggs() {
  if (!player.eggs || !player.eggs.length) return;
  for (const e of player.eggs) e.steps--;
  const ready = player.eggs.findIndex(e => e.steps <= 0);
  if (ready >= 0 && !owLocked && !busy) {
    player.eggs.splice(ready, 1);
    hatchEgg();
  }
}

async function hatchEgg() {
  if (player.party.length >= 6) {
    player.eggs.push({ steps: 40, total: 220 });
    await owSay('¡El huevo se mueve! Pero tu equipo está lleno (6).', 2200);
    return;
  }
  owLocked = true;
  busy = true; busyText = '¡El huevo se está moviendo!';
  const id = BABY_POOL[Math.floor(Math.random() * BABY_POOL.length)];
  try {
    const data = await fetchPokemonData(id);
    await loadSprite(data.spriteFront);
    if (data.spriteBack) await loadSprite(data.spriteBack);
    const mon = createPokemon(data, 5, Math.random() < 0.06);
    player.party.push(mon);
    player.seen[mon.id] = true; player.caught[mon.id] = true;
    busy = false;
    playCatch();
    await owSay(`✧ ¡El huevo eclosionó! Nació ${mon.name.toUpperCase()}${mon.shiny ? ' VARIOCOLOR' : ''}.`, 2600);
  } catch (err) {
    busy = false;
    await owSay('El huevo necesita más tiempo...', 1600);
    player.eggs.push({ steps: 60, total: 220 });
  }
  owLocked = false;
}

// --- Encargos ---
const QUEST_TYPES = [
  { key: 'catch', text: n => `Captura ${n} Pokémon`, n: () => 2 + Math.floor(Math.random() * 3), pay: 900 },
  { key: 'wins', text: n => `Gana ${n} combates`, n: () => 3 + Math.floor(Math.random() * 4), pay: 700 },
  { key: 'berries', text: n => `Recoge ${n} bayas de los árboles`, n: () => 3 + Math.floor(Math.random() * 4), pay: 600 },
  { key: 'fish', text: n => `Pesca ${n} Pokémon`, n: () => 2 + Math.floor(Math.random() * 2), pay: 800 },
];

function newQuest() {
  const t = QUEST_TYPES[Math.floor(Math.random() * QUEST_TYPES.length)];
  const n = t.n();
  quest = { key: t.key, n, done: 0, text: t.text(n), pay: t.pay + questsDone * 150 };
}

function questProgress(key, amount = 1) {
  if (!quest || quest.key !== key || quest.done >= quest.n) return;
  quest.done = Math.min(quest.n, quest.done + amount);
}

async function talkToQuestNPC() {
  playSelect();
  if (!quest) {
    newQuest();
    await owSay(`Encargo aceptado: ${quest.text}. Recompensa ${quest.pay}₽.`, 2800);
    return;
  }
  if (quest.done >= quest.n) {
    player.money += quest.pay * (player.items.amulet ? 2 : 1);
    player.berries += 1;
    questsDone++;
    playCatch();
    const pay = quest.pay * (player.items.amulet ? 2 : 1);
    quest = null;
    await owSay(`¡Encargo completado! +${pay}₽ y 1 Baya Experiencia.`, 2800);
    return;
  }
  await owSay(`Encargo: ${quest.text}  (${quest.done}/${quest.n})`, 2400);
}

// --- Objetos ocultos ---
function hiddenSpots() {
  const st = zoneState();
  if (!st.hidden) {
    const rnd = mulberry32(currentZone * 7919 + 31);
    st.hidden = [];
    let guard = 0;
    while (st.hidden.length < 8 && guard++ < 800) {
      const x = 1 + Math.floor(rnd() * (COLS - 2));
      const y = 1 + Math.floor(rnd() * (ROWS - 2));
      const c = tileAt(x, y);
      if (c !== '.' && c !== '"') continue;
      if (st.hidden.some(h => h.x === x && h.y === y)) continue;
      const kind = HIDDEN_KINDS[Math.floor(rnd() * HIDDEN_KINDS.length)];
      st.hidden.push({ x, y, kind: kind.key, label: kind.label, taken: false });
    }
  }
  return st.hidden;
}

function nearestHiddenDist() {
  let best = 99;
  for (const h of hiddenSpots()) {
    if (h.taken) continue;
    const d = Math.abs(h.x - hero.x) + Math.abs(h.y - hero.y);
    if (d < best) best = d;
  }
  return best;
}

async function searchGround() {
  if (gameState !== 'overworld' || owLocked || busy || bagOpen) return;
  const spot = hiddenSpots().find(h => !h.taken && h.x === hero.x && h.y === hero.y);
  if (!spot) {
    const d = nearestHiddenDist();
    await owSay(d <= 3 ? '¡El detector vibra fuerte! Algo está muy cerca...' : 'Rebuscas en el suelo, pero no hay nada aquí.', 1700);
    return;
  }
  spot.taken = true;
  playCatch();
  if (spot.kind === 'money') {
    const cash = (220 + Math.floor(Math.random() * 480)) * (player.items.amulet ? 2 : 1);
    player.money += cash;
    await owSay(`¡Encontraste ${cash}₽ escondidos en el suelo!`, 2200);
  } else if (spot.kind === 'potion') { player.potions++; await owSay('¡Encontraste una Poción oculta!', 2000); }
  else if (spot.kind === 'ball') { player.pokeballs++; await owSay('¡Encontraste una Poké Ball oculta!', 2000); }
  else { player.berries++; await owSay('¡Encontraste una Baya Experiencia oculta!', 2000); }
}

function drawDetector(ctx) {
  const d = nearestHiddenDist();
  if (d > 3) return;
  const p = heroPixel();
  const pulse = 0.5 + 0.5 * Math.sin(owTime * (d <= 1 ? 9 : 5));
  ctx.fillStyle = `rgba(255,210,74,${0.35 + pulse * 0.6})`;
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('!', p.x + TILE / 2, p.y - 6);
  ctx.beginPath();
  ctx.arc(p.x + TILE / 2, p.y + TILE / 2, 14 + pulse * 10, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255,210,74,${0.3 - pulse * 0.18})`;
  ctx.lineWidth = 2; ctx.stroke();
}

// --- Pesca ---
function waterAhead() {

}

// --- Montar Pokémon ---
function rideMon() { return player.party[player.activeIndex]; }
function canSurf() {
  const m = rideMon();
  return !!m && m.types.some(t => RIDE_TYPES.includes(t));
}
async function toggleRide() {
  if (gameState !== 'overworld' || owLocked || busy || bagOpen) return;
  const m = rideMon();
  if (!m || m.currentHP <= 0) { await owSay('Necesitas un Pokémon en forma para montar.', 1500); return; }
  if (riding) {
    if (tileAt(hero.x, hero.y) === '~') { await owSay('¡No puedes bajarte en medio del agua!', 1500); return; }
    riding = false;
    playSelect();
    await owSay(`Te bajas de ${cap(m.name)}.`, 1200);
  } else {
    riding = true;
    playLevelUp();
    const extra = canSurf() ? ' ¡Puedes cruzar el agua!' : '';
    await owSay(`¡Montas a ${cap(m.name)}! Te mueves más rápido.${extra}`, 1800);
  }
}

// --- Movimiento ---
function tryStep(dx, dy) {
  if (owLocked || hero.moving || busy || bagOpen || mapOpen || gameState !== 'overworld') return;
  hero.dir = dy < 0 ? 'up' : dy > 0 ? 'down' : dx < 0 ? 'left' : 'right';
  const nx = hero.x + dx, ny = hero.y + dy;
  const c = tileAt(nx, ny);

  if (c === 'G') {
    if (zoneState().leaderDefeated) { travelTo(currentZone + 1, 'forward'); }
    else { playTone(180, 0.15, 'square', 0.12); owSay(`El guardia te detiene: primero derrota al ${zoneDef().leader.title} ${zoneDef().leader.name}.`, 2200); }
    return;
  }
  if (c === 'g') { travelTo(currentZone - 1, 'back'); return; }

  if (c === 'R') {
    if (zoneState().rivalDefeated) { owSay(`${RIVAL_NAME}: ¡Te espero en la siguiente zona!`, 2000); return; }
    startTrainerBattle(rivalDef(), false, 'rival');
    return;
  }

  if (c === 'Q') { talkToQuestNPC(); return; }

  if (c === 'M') {
    playSelect();
    bagOpen = true; bagView = 'shop'; pendingStone = null;
    return;
  }

  if (c === 'F') {
    const bkey = 'F' + nx + ',' + ny;
    if (!zoneState().taken[bkey]) {
      zoneState().taken[bkey] = true;
      const got = 1 + Math.floor(Math.random() * 2);
      player.berries += got;
      questProgress('berries', got);
      playSelect();
      emitParticles(nx * TILE + TILE / 2, ny * TILE + MAP_Y + TILE / 2, 14, ['#e0407a', '#ff8ab0', '#4f9b3f'], { spread: 170, speed: 130 });
      owSay(`¡Recogiste ${got} ${got === 1 ? 'Baya Experiencia' : 'Bayas Experiencia'} del árbol!`, 1700);
    } else {
      owSay('Este árbol ya no tiene bayas.', 1100);
    }
    return;
  }

  const o = objAt(nx, ny);
  if (o && o.kind === 'trainer' && !zoneState().trainersDefeated[o.idx]) { startTrainerBattle(zoneDef().trainers[o.idx], false, o.idx); return; }
  if (o && o.kind === 'leader' && !zoneState().leaderDefeated) { startTrainerBattle(zoneDef().leader, true, -1); return; }

  if (isSolid(nx, ny)) { return; }

  hero.prevX = hero.x; hero.prevY = hero.y;
  hero.fromX = hero.x; hero.fromY = hero.y;
  hero.x = nx; hero.y = ny;
  hero.moving = true;
  hero.t = 0;
  hero.stepCount++;
  tickEggs();
}

function updateHero(dt) {
  if (!hero.moving) return;
  hero.t += dt / (riding ? 0.095 : 0.16);
  if (hero.t >= 1) { hero.t = 1; hero.moving = false; onArrive(); }
}

function heroPixel() {
  const t = hero.moving ? hero.t : 1;
  const x = (hero.fromX + (hero.x - hero.fromX) * t) * TILE;
  const y = (hero.fromY + (hero.y - hero.fromY) * t) * TILE + MAP_Y;
  return { x, y };
}

async function onArrive() {
  const c = tileAt(hero.x, hero.y);
  const key = hero.x + ',' + hero.y;
  const o = objAt(hero.x, hero.y);

  if (c === 'H') {
    const hurt = player.party.some(p => p.currentHP < p.maxHP);
    if (hurt) {
      owLocked = true;
      player.party.forEach(p => { p.currentHP = p.maxHP; p.displayHP = p.maxHP; Object.keys(p.movePP).forEach(m => { p.movePP[m] = MOVES[m].pp; }); });
      playLevelUp();
      emitParticles(hero.x * TILE + TILE / 2, hero.y * TILE + MAP_Y + TILE / 2, 22, ['#ff7a8a', '#fff', '#4af0c0'], { spread: 220, speed: 150 });
      await owSay('Tu equipo se ha recuperado por completo.', 1600);
      owLocked = false;
    }
    return;
  }

  if (o && !zoneState().taken[key]) {
    if (o.kind === 'stone') {
      zoneState().taken[key] = true;
      player.stones[o.stone] = (player.stones[o.stone] || 0) + 1;
      playCatch();
      emitParticles(hero.x * TILE + TILE / 2, hero.y * TILE + MAP_Y + TILE / 2, 18, [STONES[o.stone].color, STONES[o.stone].glow], { spread: 200, speed: 140 });
      owLocked = true;
      await owSay(`¡Encontraste una ${STONES[o.stone].name}!`, 1700);
      owLocked = false;
      return;
    }
    if (o.kind === 'potion') {
      zoneState().taken[key] = true;
      player.potions += 2;
      playSelect();
      owLocked = true;
      await owSay('¡Encontraste 2 Pociones!', 1500);
      owLocked = false;
      return;
    }
    if (o.kind === 'ball') {
      zoneState().taken[key] = true;
      player.pokeballs += 5;
      playSelect();
      owLocked = true;
      await owSay('¡Encontraste 5 Poké Balls!', 1500);
      owLocked = false;
      return;
    }
  }

  if (c === '"' && player.party.some(p => p.currentHP > 0)) {
    const sp = sparklePatch();
    if (sp && sp.x === hero.x && sp.y === hero.y) {
      zoneState().sparkle = null;
      sparkleTimer = 30 + Math.random() * 30;
      startWildBattle(true);
      return;
    }
    let chance = 0.16;
    if (riding) chance = 0.07;
    if (isNight()) chance += 0.05;
    if (Math.random() < chance) { startWildBattle(); }
  }
}

// --- Viaje entre zonas ---
async function travelTo(index, how) {
  if (index < 0 || index >= ZONES.length) return;
  owLocked = true;
  await fadeOut();
  currentZone = index;
  if (how === 'forward') {
    const g = findTile('g');
    hero.x = g ? g.x + 1 : 1; hero.y = g ? g.y : 1; hero.dir = 'right';
  } else {
    const G = findTile('G');
    hero.x = G ? G.x - 1 : COLS - 2; hero.y = G ? G.y : ROWS - 2; hero.dir = 'left';
  }
  hero.fromX = hero.x; hero.fromY = hero.y; hero.moving = false; hero.t = 1;
  updateCamera(true);
  await fadeIn();
  await owSay(`${zoneDef().name} — ${zoneDef().theme}`, 2000);
  owLocked = false;
}

function fadeOut() {
  return animateAsync({ duration: 0.35, update: (a) => { fadeAlpha = Math.min(1, a.elapsed / 0.35); } }).then(() => { fadeAlpha = 1; });
}
function fadeIn() {
  return animateAsync({ duration: 0.35, update: (a) => { fadeAlpha = 1 - Math.min(1, a.elapsed / 0.35); } }).then(() => { fadeAlpha = 0; });
}

// --- Inicio de combates desde el mundo ---
async function buildTeam(defs) {
  const team = [];
  for (const d of defs) {
    const data = await fetchPokemonData(d.id);
    await loadSprite(data.spriteFront);
    team.push(createPokemon(data, d.level));
  }
  return team;
}

function registerSeen(mon) { if (mon) player.seen[mon.id] = true; }
function dexCounts() {
  return { vistos: Object.keys(player.seen || {}).length, capturados: Object.keys(player.caught || {}).length };
}

async function startWildBattle(rare = false) {
  owLocked = true;
  busy = true; busyText = rare ? '¡Algo brilla en la hierba!' : 'Un Pokémon salvaje...';
  const z = zoneDef();
  const id = z.wild[Math.floor(Math.random() * z.wild.length)];
  let level = z.levels[0] + Math.floor(Math.random() * (z.levels[1] - z.levels[0] + 1));
  if (rare) level += 4 + Math.floor(Math.random() * 5);
  let mon;
  try {
    const data = await fetchPokemonData(id);
    await loadSprite(data.spriteFront);
    mon = createPokemon(data, level, rare && Math.random() < 0.3);
  } catch (e) {
    busy = false; owLocked = false;
    await owSay('Conexión lenta... el Pokémon huyó.', 1500);
    return;
  }
  busy = false;
  battleKind = 'wild';
  currentTrainer = null;
  registerSeen(mon);
  await enterBattle(mon, rare
    ? `¡De la hierba brillante salió un ${mon.name.toUpperCase()}${mon.shiny ? ' VARIOCOLOR' : ''} fuerte!`
    : `¡Un ${mon.name.toUpperCase()}${mon.shiny ? ' VARIOCOLOR' : ''} salvaje apareció!`);
}

async function startTrainerBattle(def, isLeader, trainerIdx) {
  owLocked = true;
  busy = true; busyText = `${def.title} ${def.name} quiere luchar`;
  let team;
  try { team = await buildTeam(def.team); }
  catch (e) { busy = false; owLocked = false; await owSay('Conexión lenta, inténtalo de nuevo.', 1500); return; }
  busy = false;
  battleKind = 'trainer';
  team.forEach(registerSeen);
  currentTrainer = { def, isLeader, team, index: 0, zone: currentZone, trainerIdx };
  await enterBattle(team[0], `¡${def.title} ${def.name} te desafía!`);
}

async function enterBattle(firstMon, intro) {
  await fadeOut();
  gameState = 'battle';
  awaitingInput = false;
  moveMenuOpen = false; itemMenuOpen = false; pokemonMenuOpen = false;
  bagOpen = false;
  currentMessage = ''; messageTimer = 0; messageQueue = [];
  particles = []; shakeAmount = 0; flashAmount = 0;
  wildPokemon = firstMon;

  const mon = player.party[player.activeIndex];
  mon.faintAlpha = 1; mon.offsetX = 0; mon.offsetY = 0; mon.hitFlash = 0; mon.displayHP = mon.currentHP;

  await fadeIn();
  wildPokemon.offsetX = 280;
  await animateAsync({ duration: 0.45, update: (a) => { wildPokemon.offsetX = 280 * (1 - Math.min(1, a.elapsed / 0.45)); } });
  wildPokemon.offsetX = 0;

  await say(intro, 1600);
  await say(`¡Adelante, ${mon.name.toUpperCase()}!`, 1200);
  endOfTurn();
}

async function returnToOverworld() {
  await fadeOut();
  wildPokemon = null;
  battleKind = 'wild';
  currentTrainer = null;
  awaitingInput = false;
  moveMenuOpen = false; itemMenuOpen = false; pokemonMenuOpen = false;
  gameState = 'overworld';
  particles = [];
  const first = player.party.findIndex(p => p.currentHP > 0);
  if (first >= 0) player.activeIndex = first;
  await fadeIn();
  owLocked = false;
  if (pendingEvos.length) await processPendingEvos_safe();
}

async function processPendingEvos_safe() {
  try { await processPendingEvos(); } catch (e) { pendingEvos = []; owLocked = false; }
}

async function onTrainerDefeated() {
  const t = currentTrainer;
  const def = t.def;
  const zs = world[t.zone];
  const rw = def.reward || {};
  player.potions += rw.potions || 0;
  player.pokeballs += rw.balls || 0;
  const prize = ((t.isLeader ? 900 : 260) + (t.zone + 1) * 140) * (player.items.amulet ? 2 : 1);
  player.money += prize;

  if (t.isLeader) {
    zs.leaderDefeated = true;
    player.badges++;
    playLevelUp();
    await say(`¡${def.title} ${def.name} ha sido derrotado! Ganaste ${prize}₽.`, 1900);
    if (def.stone) {
      player.stones[def.stone] = (player.stones[def.stone] || 0) + 1;
      await say(`${def.name} te entrega una ${STONES[def.stone].name}.`, 1900);
    }
    if (def.isChampion) {
      await say('¡Has conquistado las 6 zonas! ¡Eres el nuevo Campeón!', 2400);
      gameState = 'victory';
      return;
    }
    await say('¡El camino a la siguiente zona se ha abierto!', 1900);
  } else {
    if (t.trainerIdx === 'rival') { zs.rivalDefeated = true; } else { zs.trainersDefeated[t.trainerIdx] = true; }
    await say(`¡Has derrotado a ${def.title} ${def.name}! Ganaste ${prize}₽.`, 1800);
    if (rw.potions || rw.balls) {
      await say(`Recibiste ${rw.potions || 0} Pociones y ${rw.balls || 0} Poké Balls.`, 1700);
    }
  }
  await returnToOverworld();
}

async function whiteout() {
  await say('No te quedan Pokémon en condiciones de luchar...', 2000);
  player.party.forEach(p => {
    p.currentHP = p.maxHP; p.displayHP = p.maxHP; p.faintAlpha = 1; p.offsetY = 0; p.offsetX = 0;
    Object.keys(p.movePP).forEach(m => { p.movePP[m] = MOVES[m].pp; });
  });
  player.activeIndex = 0;
  riding = false;
  const h = findTile('H');
  if (h) { hero.x = h.x; hero.y = h.y; hero.fromX = h.x; hero.fromY = h.y; hero.moving = false; hero.t = 1; updateCamera(true); }
  await say('Volviste al centro de la zona y tu equipo fue curado.', 2000);
  await returnToOverworld();
}

// --- Piedras evolutivas ---
async function evolveMon(idx, toId) {
  const mon = player.party[idx];
  if (!mon) return false;
  owLocked = true;
  busy = true; busyText = 'Evolucionando...';
  let data;
  try {
    data = await fetchPokemonData(toId);
    await loadSprite(data.spriteFront);
    await loadSprite(data.spriteBack);
  } catch (e) {
    busy = false; owLocked = false;
    await owSay('Conexión lenta, la evolución se interrumpió.', 1600);
    return false;
  }
  busy = false;

  const ratio = mon.currentHP / mon.maxHP;
  const evolved = createPokemon(data, mon.level);
  evolved.xp = mon.xp;
  evolved.currentHP = Math.max(1, Math.round(evolved.maxHP * ratio));
  evolved.displayHP = evolved.currentHP;

  const prevState = gameState;
  evo = { from: mon, to: evolved, t: 0, done: false };
  gameState = 'evolution';
  playThrow();

  await animateAsync({ duration: 3.0, update: (a) => { evo.t = Math.min(1, a.elapsed / 3.0); } });
  evo.done = true;
  playLevelUp();
  emitParticles(W / 2, H * 0.42, 40, ['#fff', '#ffd76a', '#8ad0ff'], { spread: 320, speed: 220 });
  player.party[idx] = evolved;
  await sleep(300);
  gameState = 'overworld';
  await owSay(`¡Enhorabuena! ¡Tu ${cap(mon.name)} evolucionó a ${cap(evolved.name)}!`, 2300);
  evo = null;
  owLocked = false;
  return true;
}

async function processPendingEvos() {
  while (pendingEvos.length) {
    const e = pendingEvos.shift();
    const mon = player.party[e.idx];
    if (!mon) continue;
    owLocked = true;
    await owSay(`¿Qué? ¡${cap(mon.name)} está evolucionando!`, 1700);
    await evolveMon(e.idx, e.to);
  }
  owLocked = false;
}

// --- Piedras evolutivas ---
async function useStone(key, idx) {
  const st = STONES[key];
  const mon = player.party[idx];
  if (!st || !mon) return;
  if ((player.stones[key] || 0) <= 0) return;

  const toId = st.evo[mon.id];
  if (!toId) {
    bagOpen = false; bagView = 'items'; pendingStone = null;
    owLocked = true;
    await owSay(`La ${st.name} no tiene ningún efecto en ${cap(mon.name)}...`, 1900);
    owLocked = false;
    return;
  }

  bagOpen = false; bagView = 'items'; pendingStone = null;
  player.stones[key]--;
  const ok = await evolveMon(idx, toId);
  if (!ok) player.stones[key]++;
}

// ============================== DIBUJO DEL MUNDO ==============================
function drawGround(ctx, x, y, pal) {
  const px = x * TILE, py = y * TILE + MAP_Y;
  ctx.fillStyle = ((x + y) % 2 === 0) ? pal.ground : pal.ground2;
  ctx.fillRect(px, py, TILE, TILE);
  // textura sutil
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  const h = ((x * 31 + y * 17) % 5);
  if (h === 0) ctx.fillRect(px + 8, py + 30, 10, 3);
  if (h === 2) ctx.fillRect(px + 28, py + 12, 8, 3);
}

function drawTallGrass(ctx, x, y, pal) {
  const px = x * TILE, py = y * TILE + MAP_Y;
  ctx.fillStyle = pal.grass2;
  ctx.fillRect(px, py, TILE, TILE);
  ctx.fillStyle = pal.grass;
  for (let i = 0; i < 5; i++) {
    const bx = px + 5 + i * 9;
    const sway = Math.sin(owTime * 2 + (x + y + i) * 0.9) * 2.2;
    ctx.beginPath();
    ctx.moveTo(bx, py + TILE - 4);
    ctx.lineTo(bx + sway, py + 12 + (i % 2) * 6);
    ctx.lineTo(bx + 7, py + TILE - 4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
}

function drawWall(ctx, x, y, pal, style) {
  const px = x * TILE, py = y * TILE + MAP_Y;
  if (style === 'tree') {
    ctx.fillStyle = pal.ground2;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#6b4a2a';
    ctx.fillRect(px + 21, py + 30, 8, 16);
    ctx.fillStyle = pal.wall2;
    ctx.beginPath(); ctx.arc(px + 25, py + 24, 19, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = pal.wall;
    ctx.beginPath(); ctx.arc(px + 21, py + 21, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(px + 17, py + 17, 6, 0, Math.PI * 2); ctx.fill();
  } else if (style === 'rock' || style === 'cliff') {
    ctx.fillStyle = pal.wall2;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = pal.wall;
    ctx.beginPath();
    ctx.moveTo(px + 4, py + TILE - 4);
    ctx.lineTo(px + 12, py + 8);
    ctx.lineTo(px + 30, py + 5);
    ctx.lineTo(px + TILE - 4, py + 18);
    ctx.lineTo(px + TILE - 6, py + TILE - 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.beginPath();
    ctx.moveTo(px + 12, py + 9); ctx.lineTo(px + 29, py + 6); ctx.lineTo(px + 22, py + 20);
    ctx.closePath(); ctx.fill();
  } else if (style === 'lava') {
    ctx.fillStyle = pal.wall;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = pal.wall2;
    ctx.beginPath();
    ctx.moveTo(px + 3, py + TILE - 3); ctx.lineTo(px + 14, py + 6);
    ctx.lineTo(px + 34, py + 9); ctx.lineTo(px + TILE - 3, py + TILE - 3);
    ctx.closePath(); ctx.fill();
    const glow = 0.35 + Math.sin(owTime * 3 + (x + y)) * 0.2;
    ctx.fillStyle = `rgba(255,120,30,${glow})`;
    ctx.fillRect(px + 12, py + 22, 6, 5);
    ctx.fillRect(px + 28, py + 32, 7, 4);
  } else { // ice
    ctx.fillStyle = pal.wall2;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = pal.wall;
    ctx.beginPath();
    ctx.moveTo(px + 25, py + 4); ctx.lineTo(px + TILE - 5, py + 26);
    ctx.lineTo(px + 25, py + TILE - 4); ctx.lineTo(px + 5, py + 26);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.moveTo(px + 25, py + 8); ctx.lineTo(px + 38, py + 25); ctx.lineTo(px + 25, py + 24);
    ctx.closePath(); ctx.fill();
  }
}

function drawWater(ctx, x, y, pal) {
  const px = x * TILE, py = y * TILE + MAP_Y;
  ctx.fillStyle = pal.water || '#2f7fd0';
  ctx.fillRect(px, py, TILE, TILE);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 2; i++) {
    const yy = py + 16 + i * 18;
    ctx.beginPath();
    for (let xx = 0; xx <= TILE; xx += 5) {
      const v = yy + Math.sin((xx + px) * 0.12 + owTime * 2.2 + i) * 2.5;
      if (xx === 0) ctx.moveTo(px + xx, v); else ctx.lineTo(px + xx, v);
    }
    ctx.stroke();
  }
}

function drawGate(ctx, x, y, locked, back) {
  const px = x * TILE, py = y * TILE + MAP_Y;
  ctx.fillStyle = '#4a3a2a';
  ctx.fillRect(px, py, TILE, TILE);
  ctx.fillStyle = back ? '#6a5a3a' : (locked ? '#7a3a3a' : '#3a7a4a');
  roundRect(ctx, px + 7, py + 5, TILE - 14, TILE - 8, 6); ctx.fill();
  ctx.strokeStyle = '#e8e0c8'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#e8e0c8';
  ctx.font = 'bold 9px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (back) {
    ctx.fillText('◀', px + TILE / 2, py + TILE / 2 - 5);
    ctx.fillText('SAL', px + TILE / 2, py + TILE / 2 + 9);
  } else if (locked) {
    // candado
    ctx.fillRect(px + TILE / 2 - 6, py + 22, 12, 10);
    ctx.strokeStyle = '#e8e0c8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px + TILE / 2, py + 22, 5, Math.PI, 0); ctx.stroke();
    ctx.font = 'bold 8px "Courier New", monospace';
    ctx.fillText('CERRADO', px + TILE / 2, py + 40);
  } else {
    ctx.fillText('▶', px + TILE / 2, py + TILE / 2 - 5);
    ctx.fillText('IR', px + TILE / 2, py + TILE / 2 + 9);

}

function drawHealTile(ctx, x, y) {

function drawItemTile(ctx, x, y, obj) {
  const px = x * TILE, py = y * TILE + MAP_Y;
  const bob = Math.sin(owTime * 3 + x + y) * 3;
  const cx = px + TILE / 2, cy = py + TILE / 2 + bob;
  if (obj.kind === 'stone') {
    const st = STONES[obj.stone];
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(cx, py + TILE - 8, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = st.color;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 13); ctx.lineTo(cx + 11, cy - 2); ctx.lineTo(cx, cy + 13); ctx.lineTo(cx - 11, cy - 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = st.glow;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 13); ctx.lineTo(cx + 5, cy - 3); ctx.lineTo(cx, cy + 3); ctx.lineTo(cx - 5, cy - 3);
    ctx.closePath(); ctx.fill();
  } else if (obj.kind === 'potion') {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(cx, py + TILE - 8, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8e8f0';
    roundRect(ctx, cx - 8, cy - 8, 16, 18, 4); ctx.fill();
    ctx.fillStyle = '#4af0c0';
    roundRect(ctx, cx - 6, cy - 1, 12, 9, 3); ctx.fill();
    ctx.fillStyle = '#b0b0c0';
    ctx.fillRect(cx - 4, cy - 13, 8, 6);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(cx, py + TILE - 8, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e04a4a';
    ctx.beginPath(); ctx.arc(cx, cy, 11, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#f4f4f4';
    ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.fillRect(cx - 11, cy - 1.5, 22, 3);
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTrainerNPC(ctx, x, y, def, isLeader, defeated) {
  const px = x * TILE, py = y * TILE + MAP_Y;
  const cx = px + TILE / 2;
  const bob = defeated ? 0 : Math.sin(owTime * 2.5 + x) * 1.5;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(cx, py + TILE - 7, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = defeated ? 0.55 : 1;
  // cuerpo
  ctx.fillStyle = def.color;
  roundRect(ctx, cx - 10, py + 20 + bob, 20, 20, 5); ctx.fill();
  // piernas
  ctx.fillStyle = '#334';
  ctx.fillRect(cx - 8, py + 38 + bob, 6, 7);
  ctx.fillRect(cx + 2, py + 38 + bob, 6, 7);
  // cabeza
  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath(); ctx.arc(cx, py + 15 + bob, 9, 0, Math.PI * 2); ctx.fill();
  // pelo/gorra
  ctx.fillStyle = isLeader ? '#f8d030' : '#3a3a4a';
  ctx.beginPath(); ctx.arc(cx, py + 13 + bob, 9, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - 10, py + 12 + bob, 20, 3);
  // ojos
  ctx.fillStyle = '#222';
  ctx.fillRect(cx - 4, py + 15 + bob, 2, 3);
  ctx.fillRect(cx + 2, py + 15 + bob, 2, 3);
  ctx.globalAlpha = 1;
  if (isLeader && !defeated) {
    // corona
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    ctx.moveTo(cx - 8, py + 6 + bob); ctx.lineTo(cx - 4, py + 1 + bob); ctx.lineTo(cx, py + 6 + bob);
    ctx.lineTo(cx + 4, py + 1 + bob); ctx.lineTo(cx + 8, py + 6 + bob);
    ctx.closePath(); ctx.fill();
  }
  if (defeated) {
    ctx.fillStyle = '#4af0c0';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('✓', cx + 14, py + 12);
  } else {
    // signo de exclamación flotante
    const a = 0.5 + Math.sin(owTime * 4 + x) * 0.5;
    ctx.globalAlpha = 0.5 + a * 0.5;
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', cx + 15, py + 8);
    ctx.globalAlpha = 1;
  }
}

function drawHero(ctx) {
  const p = heroPixel();
  const cx = p.x + TILE / 2;
  if (fishing) drawRod(ctx, p, cx);
  if (riding) { drawMountedHero(ctx, p, cx); return; }
  const walk = hero.moving ? Math.sin(hero.t * Math.PI * 2) * 2 : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(cx, p.y + TILE - 7, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  // cuerpo
  ctx.fillStyle = '#e04a4a';
  roundRect(ctx, cx - 10, p.y + 20, 20, 19, 5); ctx.fill();
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(cx - 5, p.y + 24, 10, 10);
  // piernas
  ctx.fillStyle = '#2a3a6a';
  ctx.fillRect(cx - 8, p.y + 37 + walk, 6, 8);
  ctx.fillRect(cx + 2, p.y + 37 - walk, 6, 8);
  // cabeza
  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath(); ctx.arc(cx, p.y + 15, 9, 0, Math.PI * 2); ctx.fill();
  // gorra
  ctx.fillStyle = '#d03a3a';
  ctx.beginPath(); ctx.arc(cx, p.y + 13, 9, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#f4f4f4';
  if (hero.dir === 'down') ctx.fillRect(cx - 10, p.y + 12, 20, 3);
  else if (hero.dir === 'up') ctx.fillRect(cx - 10, p.y + 9, 20, 3);
  else if (hero.dir === 'left') ctx.fillRect(cx - 13, p.y + 12, 16, 3);
  else ctx.fillRect(cx - 3, p.y + 12, 16, 3);
  // ojos según dirección
  ctx.fillStyle = '#222';
  if (hero.dir === 'down') { ctx.fillRect(cx - 4, p.y + 16, 2, 3); ctx.fillRect(cx + 2, p.y + 16, 2, 3); }
  else if (hero.dir === 'left') { ctx.fillRect(cx - 6, p.y + 16, 2, 3); }
  else if (hero.dir === 'right') { ctx.fillRect(cx + 4, p.y + 16, 2, 3); }
}

function drawBerryTree(ctx, x, y, pal, hasBerries) {
  const px = x * TILE, py = y * TILE + MAP_Y;
  ctx.fillStyle = pal.ground2;
  ctx.fillRect(px, py, TILE, TILE);
  ctx.fillStyle = '#6b4a2a';
  ctx.fillRect(px + 21, py + 30, 8, 16);
  ctx.fillStyle = pal.wall2;
  ctx.beginPath(); ctx.arc(px + 25, py + 24, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = pal.wall;
  ctx.beginPath(); ctx.arc(px + 22, py + 21, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(px + 17, py + 16, 6, 0, Math.PI * 2); ctx.fill();
  if (hasBerries) {
    const spots = [[14, 26], [30, 16], [34, 30], [22, 34], [26, 10]];
