      const bxp = px + spots[i][0], byp = py + spots[i][1] + bob;
      ctx.fillStyle = '#2f5a24';
      ctx.fillRect(bxp - 1, byp - 7, 2, 4);
      ctx.fillStyle = '#e0325f';
      ctx.beginPath(); ctx.arc(bxp, byp, 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.beginPath(); ctx.arc(bxp - 1.4, byp - 1.6, 1.3, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawRod(ctx, p, cx) {
  const [dx, dy] = DIRV[hero.dir] || [0, 1];
  const ex = cx + dx * 40, ey = p.y + 20 + dy * 40;
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cx, p.y + 22); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex, ey + 10 + Math.sin(owTime * 5) * 2); ctx.stroke();
  ctx.fillStyle = '#e04a4a';
  ctx.beginPath(); ctx.arc(ex, ey + 12, 3, 0, Math.PI * 2); ctx.fill();
}

// --- Pokémon acompañante ---
function drawFollower(ctx) {
  if (riding) return;
  const m = player.party[player.activeIndex];
  if (!m || m.currentHP <= 0) return;
  const img = spriteCache[spriteURL(m.id)];
  if (!img) return;
  const t = hero.moving ? hero.t : 1;
  const pxT = hero.prevX === undefined ? hero.fromX : hero.prevX;
  const pyT = hero.prevY === undefined ? hero.fromY : hero.prevY;
  const bxT = hero.moving ? hero.fromX : hero.x - (DIRV[hero.dir] || [0, 1])[0];
  const byT = hero.moving ? hero.fromY : hero.y - (DIRV[hero.dir] || [0, 1])[1];
  const sxT = hero.moving ? pxT : bxT, syT = hero.moving ? pyT : byT;
  const fx = (sxT + (bxT - sxT) * t) * TILE;
  const fy = (syT + (byT - syT) * t) * TILE + MAP_Y;
  const bob = Math.sin(owTime * 6) * (hero.moving ? 1.6 : 0.6);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(fx + TILE / 2, fy + TILE - 8, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.imageSmoothingEnabled = false;
  const sz = 38;
  ctx.save();
  if (hero.dir === 'left') { ctx.translate((fx + TILE / 2) * 2, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, fx + TILE / 2 - sz / 2, fy + TILE - sz - 2 + bob, sz, sz);
  ctx.restore();
}

function drawMountedHero(ctx, p, cx) {
  const m = rideMon();
  const bob = Math.sin(owTime * (hero.moving ? 12 : 3)) * 2;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(cx, p.y + TILE - 5, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
  if (tileAt(hero.x, hero.y) === '~') {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(cx, p.y + TILE - 8, 20 + Math.sin(owTime * 4) * 2, 7, 0, 0, Math.PI * 2); ctx.stroke();
  }
  const img = m && spriteCache[spriteURL(m.id)];
  if (img) {
    ctx.imageSmoothingEnabled = false;
    const sz = 54;
    ctx.save();
    if (hero.dir === 'left') { ctx.translate(cx * 2, 0); ctx.scale(-1, 1); }
    ctx.drawImage(img, cx - sz / 2, p.y + TILE - sz + 6 + bob, sz, sz);
    ctx.restore();
  }
  // jinete, más pequeño y encima
  const hy = p.y + 2 + bob;
  ctx.fillStyle = '#e04a4a';
  roundRect(ctx, cx - 7, hy + 14, 14, 13, 4); ctx.fill();
  ctx.fillStyle = '#2a3a6a';
  ctx.fillRect(cx - 6, hy + 25, 5, 5);
  ctx.fillRect(cx + 1, hy + 25, 5, 5);
  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath(); ctx.arc(cx, hy + 9, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d03a3a';
  ctx.beginPath(); ctx.arc(cx, hy + 8, 6.5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#f4f4f4';
  if (hero.dir === 'left') ctx.fillRect(cx - 10, hy + 7, 12, 2.5);
  else if (hero.dir === 'up') ctx.fillRect(cx - 7, hy + 5, 14, 2.5);
  else ctx.fillRect(cx - 2, hy + 7, 12, 2.5);
  ctx.fillStyle = '#222';
  if (hero.dir !== 'up') { ctx.fillRect(cx - 3, hy + 10, 1.8, 2.4); ctx.fillRect(cx + 1.4, hy + 10, 1.8, 2.4); }
}

function drawOverworld(ctx) {
  const z = zoneDef(), zs = zoneState(), pal = z.pal;

  // cielo / fondo
  const sky = ctx.createLinearGradient(0, 0, 0, MAP_Y);
  sky.addColorStop(0, pal.skyTop);
  sky.addColorStop(1, pal.skyBot);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, MAP_Y);
  ctx.fillStyle = pal.ground;
  ctx.fillRect(0, MAP_Y, W, VIEW_H);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, MAP_Y, VIEW_W, VIEW_H); ctx.clip();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));

  const x0 = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const x1 = Math.min(COLS - 1, Math.ceil((cam.x + VIEW_W) / TILE));
  const y0 = Math.max(0, Math.floor(cam.y / TILE) - 1);
  const y1 = Math.min(ROWS - 1, Math.ceil((cam.y + VIEW_H) / TILE));

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const c = z.map[y][x];
      if (c === '#') { drawWall(ctx, x, y, pal, z.wallStyle); continue; }
      if (c === 'M') { drawGround(ctx, x, y, pal); drawShop(ctx, x, y); continue; }
      if (c === 'Q') { drawGround(ctx, x, y, pal); drawQuestNPC(ctx, x, y); continue; }
      if (c === 'R') { drawGround(ctx, x, y, pal); drawRivalNPC(ctx, x, y, !!zs.rivalDefeated); continue; }
      if (c === 'F') { drawBerryTree(ctx, x, y, pal, !zs.taken['F' + x + ',' + y]); continue; }
      if (c === '~') { drawWater(ctx, x, y, pal); continue; }
      if (c === '"') { drawTallGrass(ctx, x, y, pal); continue; }
      drawGround(ctx, x, y, pal);
      if (c === 'G') drawGate(ctx, x, y, !zs.leaderDefeated, false);
      else if (c === 'g') drawGate(ctx, x, y, false, true);
      else if (c === 'H') drawHealTile(ctx, x, y);
    }
  }

  // objetos visibles
  for (const key in zs.objects) {
    const [ox, oy] = key.split(',').map(Number);
    if (ox < x0 - 1 || ox > x1 + 1 || oy < y0 - 1 || oy > y1 + 1) continue;
    const o = zs.objects[key];
    if (o.kind === 'trainer') drawTrainerNPC(ctx, ox, oy, z.trainers[o.idx], false, !!zs.trainersDefeated[o.idx]);
    else if (o.kind === 'leader') drawTrainerNPC(ctx, ox, oy, z.leader, true, zs.leaderDefeated);
    else if (!zs.taken[key]) drawItemTile(ctx, ox, oy, o);
  }

  drawSparklePatch(ctx);
  drawDetector(ctx);
  drawFollower(ctx);
  drawHero(ctx);
  ctx.restore();

  const ph = dayPhase();
  if (ph.tint) {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, MAP_Y, VIEW_W, VIEW_H); ctx.clip();
    ctx.fillStyle = ph.tint;
    ctx.fillRect(0, MAP_Y, VIEW_W, VIEW_H);
    if (ph.name === 'Noche') {
      const hp2 = heroPixel();
      const gx = hp2.x + TILE / 2 - cam.x, gy = hp2.y + TILE / 2 - cam.y;
      const gr = ctx.createRadialGradient(gx, gy, 20, gx, gy, 170);
      gr.addColorStop(0, 'rgba(255,235,170,0.22)');
      gr.addColorStop(1, 'rgba(255,235,170,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(0, MAP_Y, VIEW_W, VIEW_H);
    }
    ctx.restore();
  }

  drawWeather(ctx);
  drawParticles(ctx);
  drawOWHud(ctx);
  drawMinimap(ctx);
  drawDpad(ctx);

  if (owMessage) drawOWMessage(ctx);
  if (bagOpen) drawBag(ctx);
  if (mapOpen && !bagOpen) drawMapScreen(ctx);
}

function drawMinimap(ctx) {
  const z = zoneDef(), zs = zoneState();
  const sc = 3.2, mw = COLS * sc, mh = ROWS * sc;
  const mx = W - mw - 16, my = MAP_Y + 12;

  ctx.fillStyle = 'rgba(12,14,20,0.72)';
  roundRect(ctx, mx - 6, my - 6, mw + 12, mh + 12, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(74,240,192,0.55)'; ctx.lineWidth = 1; ctx.stroke();

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const c = z.map[y][x];
      let col = null;
      if (c === '#') col = 'rgba(255,255,255,0.10)';
      else if (c === 'F') col = zs.taken['F' + x + ',' + y] ? 'rgba(255,255,255,0.10)' : '#e0508a';
      else if (c === '~') col = 'rgba(80,150,230,0.55)';
      else if (c === '"') col = 'rgba(90,200,110,0.55)';
      else col = 'rgba(255,255,255,0.26)';
      ctx.fillStyle = col;
      ctx.fillRect(mx + x * sc, my + y * sc, sc, sc);
    }
  }

  for (const key in zs.objects) {
    const [ox, oy] = key.split(',').map(Number);
    const o = zs.objects[key];
    let col = null;
    if (o.kind === 'leader') col = zs.leaderDefeated ? 'rgba(255,210,74,0.35)' : '#ffd24a';
    else if (o.kind === 'trainer') col = zs.trainersDefeated[o.idx] ? 'rgba(255,90,90,0.3)' : '#ff6a6a';
    else if (!zs.taken[key]) col = '#8fd8ff';
    if (!col) continue;
    ctx.fillStyle = col;
    ctx.fillRect(mx + ox * sc - 0.5, my + oy * sc - 0.5, sc + 1, sc + 1);
  }

  // puertas y centro
  const marks = [['M', '#7ab8e8'], ['Q', '#ffd24a'], ['R', '#c878f0'], ['G', zs.leaderDefeated ? '#4af0c0' : '#e06060'], ['g', '#c8c8d8'], ['H', '#ffffff']];
  for (const [ch, col] of marks) {
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (z.map[y][x] === ch) {
      ctx.fillStyle = col; ctx.fillRect(mx + x * sc - 0.5, my + y * sc - 0.5, sc + 1, sc + 1);
    }
  }

  // héroe
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(mx + hero.x * sc - 1, my + hero.y * sc - 1, sc + 2, sc + 2);

  // recuadro de la vista
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(mx + (cam.x / TILE) * sc, my + (cam.y / TILE) * sc, (VIEW_W / TILE) * sc, (VIEW_H / TILE) * sc);
}

function drawOWHud(ctx) {

  ctx.fillRect(0, MAP_Y - 3, W, 3);

  const z = zoneDef();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f4f4f8';
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillText(`${currentZone + 1}/6  ${z.name}`, 14, 20);
  ctx.font = '11px "Courier New", monospace';
  ctx.fillStyle = '#9aa0b4';
  ctx.fillText(z.theme, 14, 38);
  const ph3 = dayPhase();
  ctx.fillStyle = ph3.name === 'Noche' ? '#8aa0ff' : '#c9d18a';
  ctx.fillText(`${ph3.name === 'Noche' ? '☾' : '☀'} ${ph3.name}  ·  ${weatherName()}`, 14, 58);

  }
  ctx.fillStyle = '#9aa0b4';
  ctx.font = '10px "Courier New", monospace';

  // Pokémon activo

    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(`${cap(mon.name)}  Lv${mon.level}`, 430, 18);

    ctx.fillStyle = '#9aa0b4';
    ctx.font = '10px "Courier New", monospace';
    ctx.fillText(`PS ${mon.currentHP}/${mon.maxHP}  ·  Equipo ${player.party.length}/6`, 430, 52);
  }

  // objetos
  ctx.fillStyle = '#9aa0b4';
  ctx.font = '11px "Courier New", monospace';

  ctx.fillText(`Pociones ${player.potions}`, 600, 18);
  ctx.fillText(`Balls ${player.pokeballs}`, 600, 38);
  ctx.fillText(`Piedras ${stoneCount}`, 600, 58);
  ctx.fillText(`Bayas ${player.berries || 0}`, 700, 18);
  const dc = dexCounts();
  ctx.fillText(`Dex ${dc.capturados}/${dc.vistos}`, 700, 38);
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.fillText(`${player.money}₽`, 700, 58);
  ctx.fillStyle = '#9aa0b4';
  ctx.font = '10px "Courier New", monospace';
  if (quest) {
    const q = quest.done >= quest.n ? '✔ Encargo listo: cobra en el tablón' : `Encargo: ${quest.text} (${quest.done}/${quest.n})`;
    ctx.fillStyle = quest.done >= quest.n ? '#ffd24a' : '#9aa0b4';
    ctx.fillText(q, 14, 82);
  } else {
    ctx.fillText('Habla con el tablón de encargos para aceptar uno', 14, 82);
  }
  if (player.eggs && player.eggs.length) {
    const e0 = player.eggs[0];
    ctx.fillStyle = '#f4c7d8';
    ctx.fillText(`○ Huevo x${player.eggs.length} · ${Math.max(0, e0.steps)} pasos`, 430, 82);
  }

  // botón mochila
  const bagBtn = { label: 'MOCHILA', x: W - 130, y: 10, w: 115, h: 26 };

  ctx.fillStyle = hov ? '#4af0c0' : '#2a2e3e';
  roundRect(ctx, bagBtn.x, bagBtn.y, bagBtn.w, bagBtn.h, 6); ctx.fill();
  ctx.strokeStyle = '#4af0c0'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = hov ? '#12141c' : '#f4f4f8';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(bagBtn.label, bagBtn.x + bagBtn.w / 2, bagBtn.y + bagBtn.h / 2);

  const rideBtn = { label: riding ? 'BAJAR (R)' : 'MONTAR (R)', x: W - 130, y: 42, w: 115, h: 26 };
  const hov2 = getHoveredButton([rideBtn]);
  ctx.fillStyle = hov2 ? '#ffd24a' : (riding ? '#5a4a1e' : '#2a2e3e');
  roundRect(ctx, rideBtn.x, rideBtn.y, rideBtn.w, rideBtn.h, 6); ctx.fill();
  ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = hov2 ? '#12141c' : '#ffe9a8';
  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(rideBtn.label, rideBtn.x + rideBtn.w / 2, rideBtn.y + rideBtn.h / 2);

  owButtons = [{ ...bagBtn, action: 'bag' }, { ...rideBtn, action: 'ride' }];
}

function drawDpad(ctx) {
  const bx = W - 100, by = H - 68, s = 30;
  const pad = [
    { action: 'up', x: bx + s, y: by, w: s, h: s, label: '▲' },
    { action: 'left', x: bx, y: by + s, w: s, h: s, label: '◀' },
    { action: 'down', x: bx + s, y: by + s, w: s, h: s, label: '▼' },
    { action: 'right', x: bx + s * 2, y: by + s, w: s, h: s, label: '▶' },
  ];
  const hov = getHoveredButton(pad);
  for (const b of pad) {
    ctx.fillStyle = b === hov ? 'rgba(74,240,192,0.9)' : 'rgba(20,22,30,0.45)';
    roundRect(ctx, b.x, b.y, b.w, b.h, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = b === hov ? '#12141c' : '#e8e8f0';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  owButtons = owButtons.concat(pad);

}

function drawBag(ctx) {
  ctx.fillStyle = 'rgba(10,12,18,0.82)';
  ctx.fillRect(0, 0, W, H);

  const px = 110, py = 70, pw = W - 220, ph = H - 140;
  ctx.fillStyle = '#f4f4f0';
  roundRect(ctx, px, py, pw, ph, 12); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const title = bagView === 'shop' ? `TIENDA POKÉMON          ${player.money}₽`
    : bagView === 'items' ? 'MOCHILA'
    : bagView === 'berry' ? '¿A qué Pokémon le das la Baya Experiencia?'
    : `¿En qué Pokémon usar la ${STONES[pendingStone].name}?`;

  if (bagView === 'shop') {
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#666';
    ctx.fillText('¡Bienvenido! Gana dinero derrotando entrenadores y Pokémon salvajes.', px + 24, py + 50);

    SHOP_ITEMS.forEach((it, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const cw = (pw - 48 - 24) / 3, chh = 62;
      const owned = (it.key === 'amulet' || it.key === 'luckyegg') && player.items[it.key];
      const b = { action: 'buy', item: it.key, x: px + 24 + col * (cw + 12), y: py + 62 + row * (chh + 8), w: cw, h: chh, enabled: player.money >= it.price && !owned };
      btns.push(b);
      const hov = getHoveredButton([b]) === b && b.enabled;
      ctx.fillStyle = !b.enabled ? '#e8e8e4' : (hov ? '#4af0c0' : '#ffffff');
      roundRect(ctx, b.x, b.y, b.w, b.h, 8); ctx.fill();
      ctx.strokeStyle = b.enabled ? '#777' : '#ccc'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = b.enabled ? '#222' : '#9a9a96';
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.fillText(it.name, b.x + 12, b.y + 16);

      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillText(owned ? 'EN TU MOCHILA' : it.price + '₽', b.x + 12, b.y + 34);
      ctx.fillStyle = '#777';
      ctx.font = '10px "Courier New", monospace';
      ctx.fillText(it.desc, b.x + 12, b.y + 51);
    });

    if (shopMessage) {

    ctx.fillStyle = '#222'; ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('SALIR', closeS.x + closeS.w / 2, closeS.y + closeS.h / 2);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#888'; ctx.font = '11px "Courier New", monospace';
    ctx.fillText(`Pociones x${player.potions} · Balls x${player.pokeballs} · Bayas x${player.berries || 0} · Huevos x${(player.eggs || []).length}${player.items.amulet ? ' · Amuleto Moneda' : ''}${player.items.luckyegg ? ' · Huevo Suerte' : ''}`, px + 24, py + ph - 31);
    owButtons = btns;
    return;
  }

  if (bagView === 'items') {
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#666';
    ctx.fillText('Las piedras evolucionan a los compatibles · las bayas dan experiencia.', px + 24, py + 50);

    ctx.fillStyle = '#333';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(`Pociones x${player.potions}        Poké Balls x${player.pokeballs}`, px + 24, py + 78);
    const dcb = dexCounts();
    ctx.fillStyle = '#555'; ctx.font = '11px "Courier New", monospace';
    ctx.fillText(`Pokédex: ${dcb.vistos} vistos · ${dcb.capturados} capturados   ·   R montar · F pescar · E buscar · M mapa` +
      (canSurf() ? ' (¡este puede surfear!)' : ''), px + 24, py + ph - 52);

// --- Pantalla de evolución ---
function drawEvolution(ctx) {
  ctx.fillStyle = '#0d1018';
  ctx.fillRect(0, 0, W, H);

  const t = evo ? evo.t : 1;
  // Destellos radiales
  const cx = W / 2, cy = H * 0.42;
  const pulse = 0.5 + 0.5 * Math.sin(owTime * (6 + t * 30));
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 200 + pulse * 60);
  g.addColorStop(0, `rgba(255,255,255,${0.25 + t * 0.5})`);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Rayos
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(owTime * 0.6);
  ctx.globalAlpha = 0.12 + t * 0.2;
  ctx.fillStyle = '#ffe9a8';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(240, -16); ctx.lineTo(240, 16); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // Alternancia de sprites, cada vez más rápida
  const freq = 2 + t * 18;
  const showNew = t > 0.92 ? true : (Math.sin(owTime * freq) > 0);
  const mon = showNew ? evo.to : evo.from;
  const img = spriteCache[spriteURL(mon.id)];
  const size = 96 * 2.4;
  if (img) {
    ctx.imageSmoothingEnabled = false;
    ctx.save();
    ctx.globalAlpha = 1;
    const pop = t < 0.92 ? 1 + 0.06 * Math.sin(owTime * freq) : 1;
    const sz = size * pop;
    if (t < 0.92) ctx.globalAlpha = 0.75 + 0.25 * Math.abs(Math.sin(owTime * freq));
    ctx.drawImage(img, cx - sz / 2, cy - sz / 2, sz, sz);
    ctx.restore();
  }

  drawParticles(ctx);

  ctx.fillStyle = 'rgba(245,245,245,0.97)';
  roundRect(ctx, 40, H - 96, W - 80, 76, 8); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const txt = t < 0.92 ? `¿Qué? ¡${cap(evo.from.name)} está evolucionando!` : `¡${cap(evo.from.name)} evolucionó a ${cap(evo.to.name)}!`;
  ctx.fillText(txt, W / 2, H - 58);
}

// --- Superposiciones ---
function drawBusy(ctx) {
  ctx.fillStyle = 'rgba(8,10,16,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f4f4f0';
  roundRect(ctx, W / 2 - 190, H / 2 - 46, 380, 92, 12); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(busyText || 'Cargando...', W / 2, H / 2 - 10);
  // barra animada
  const bw = 300, bx = W / 2 - bw / 2, by = H / 2 + 16;
  ctx.fillStyle = '#ddd'; roundRect(ctx, bx, by, bw, 10, 5); ctx.fill();
  const p = (Math.sin(owTime * 3) + 1) / 2;
  ctx.fillStyle = '#4af0c0';
  roundRect(ctx, bx + p * (bw - 90), by, 90, 10, 5); ctx.fill();
}

function drawFade(ctx) {
  if (fadeAlpha <= 0) return;
  ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
  ctx.fillRect(0, 0, W, H);
}

// --- Teclado ---
const heldKeys = {};
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
};
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

window.addEventListener('keydown', (e) => {
  initAudio();
  if (KEYMAP[e.code]) {
    heldKeys[KEYMAP[e.code]] = true;
    e.preventDefault();
    return;
  }
  if (e.code === 'KeyB' && gameState === 'overworld' && !owLocked && !busy) {
    playSelect();
    bagOpen = !bagOpen; bagView = 'items'; pendingStone = null;
    e.preventDefault();
  } else if (e.code === 'KeyM' && gameState === 'overworld' && !bagOpen && !busy) {
    mapOpen = !mapOpen;
    playSelect();
    e.preventDefault();
  } else if (e.code === 'KeyE' && gameState === 'overworld' && !mapOpen) {
    searchGround();
    e.preventDefault();
  } else if (e.code === 'KeyF' && gameState === 'overworld' && !mapOpen) {
    tryFish();
    e.preventDefault();
  } else if (e.code === 'KeyR' && gameState === 'overworld' && !mapOpen) {
    toggleRide();
    e.preventDefault();
  } else if (e.code === 'Escape') {
    if (mapOpen) { mapOpen = false; }
    else if (bagView === 'stone' || bagView === 'berry') { bagView = 'items'; pendingStone = null; }
    else bagOpen = false;
  }
});
window.addEventListener('keyup', (e) => {
  if (KEYMAP[e.code]) { heldKeys[KEYMAP[e.code]] = false; e.preventDefault(); }
});

function updateOverworldInput() {
  if (gameState !== 'overworld' || owLocked || busy || bagOpen || hero.moving) return;
  for (const d of ['up', 'down', 'left', 'right']) {
    if (heldKeys[d]) { const [dx, dy] = DIRV[d]; tryStep(dx, dy); return; }
  }
}

// --- Click handling ---
canvas = document.getElementById('game-canvas');
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

canvas.addEventListener('click', (e) => {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;

  if (gameState === 'title') {
    const btn = getHoveredButton(battleState?.starterButtons);
    if (btn) {
      playSelect();
      selectStarter(btn.id);
    }
  } else if (gameState === 'battle') {
    if (!awaitingInput) return;

    if (moveMenuOpen) {
      const btn = getHoveredButton(battleState?.moveButtons);
      if (btn) {
        playSelect();
        if (btn.isBack) {
          moveMenuOpen = false;
        } else {
          playerUseMove(btn.move);
        }
      }
    } else if (itemMenuOpen) {
      const btn = getHoveredButton(battleState?.itemButtons);
      if (btn) {
        playSelect();
        if (btn.action === 'back') {
          itemMenuOpen = false;
        } else if (btn.action === 'potion') {
          usePotion();
        } else if (btn.action === 'ball') {
          usePokeball();
        }
      }
    } else if (pokemonMenuOpen) {
      const btn = getHoveredButton(battleState?.monButtons);
      if (btn) {
        playSelect();
        if (btn.isBack) {
          pokemonMenuOpen = false;
        } else {
          switchPokemon(btn.index);
        }
      }
    } else {
      const btn = getHoveredButton(battleState?.buttons);
      if (btn) {
        playSelect();
        if (btn.label === 'LUCHAR') moveMenuOpen = true;
        else if (btn.label === 'MOCHILA') itemMenuOpen = true;
        else if (btn.label === 'POKÉMON') pokemonMenuOpen = true;
        else if (btn.label === 'HUÍR') fleeBattle();
      }
    }
  } else if (gameState === 'overworld') {
    if (busy || owLocked) return;
    const btn = getHoveredButton(owButtons);
    if (!btn) return;
    if (bagOpen) {
      if (btn.action === 'close') { playSelect(); bagOpen = false; bagView = 'items'; pendingStone = null; }
      else if (btn.action === 'stone' && btn.enabled) { playSelect(); pendingStone = btn.stone; bagView = 'stone'; }
      else if (btn.action === 'bagback') { playSelect(); bagView = 'items'; pendingStone = null; }
      else if (btn.action === 'buy' && btn.enabled) { buyItem(btn.item); }
      else if (btn.action === 'berry' && btn.enabled) { playSelect(); bagView = 'berry'; pendingStone = null; }
      else if (btn.action === 'target') { playSelect(); if (bagView === 'berry') useBerry(btn.index); else useStone(pendingStone, btn.index); }
      return;
    }
    if (mapOpen) {
      if (btn.action === 'warp' && btn.enabled) { playSelect(); warpTo(btn.zone); }
      return;
    }
    if (btn.action === 'bag') { playSelect(); bagOpen = true; bagView = 'items'; pendingStone = null; return; }
    if (btn.action === 'ride') { toggleRide(); return; }
    if (DIRV[btn.action]) { const [dx, dy] = DIRV[btn.action]; tryStep(dx, dy); }
  } else if (gameState === 'gameover' || gameState === 'victory') {
    const btn = getHoveredButton([battleState?.restartBtn]);
    if (btn) {
      playSelect();
      resetGame();
    }
  }
});

// --- Starter selection ---
async function selectStarter(id) {
  gameState = 'loading';
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('loading-text').textContent = `Cargando ${id === 1 ? 'Bulbasaur' : id === 4 ? 'Charmander' : 'Squirtle'}...`;

  const baseData = await fetchPokemonData(id);
  await loadSprite(baseData.spriteFront);
  await loadSprite(baseData.spriteBack);

  const starter = createPokemon(baseData, 5);
  player.party = [starter];
  player.activeIndex = 0;
  player.seen = {}; player.caught = {};
  player.seen[starter.id] = true; player.caught[starter.id] = true;
  player.money = 600;
  player.berries = 0;
  player.eggs = [];
  player.items = {};
  quest = null; questsDone = 0;
  player.potions = 5;
  player.pokeballs = 10;
  player.wins = 0;

  document.getElementById('loading').style.display = 'none';

  // Entrar al mundo abierto
  buildWorld();
  currentZone = 0;
  const spawn = { x: 1, y: 1 };
  hero.x = spawn.x; hero.y = spawn.y; hero.fromX = spawn.x; hero.fromY = spawn.y;
  hero.dir = 'down'; hero.moving = false; hero.t = 1;
  gameState = 'overworld';
  updateCamera(true);
  owLocked = true;
  await owSay(`¡${cap(starter.name)} es tu nuevo compañero!`, 2000);
  await owSay(`${zoneDef().name} — explora la hierba alta y derrota a la ${zoneDef().leader.title} ${zoneDef().leader.name} para abrir la siguiente zona.`, 3200);
  owLocked = false;
}

// --- Reset game ---
function resetGame() {
  player = { party: [], activeIndex: 0, potions: 5, pokeballs: 10, money: 600, wins: 0, badges: 0, stones: {} };
  STONE_KEYS.forEach(k => { player.stones[k] = 0; });
  pendingEvos = [];
  player.berries = 0;
  player.seen = {}; player.caught = {};
  riding = false; dayTime = 60; fishing = false; weatherParts = []; mapOpen = false;
  wildPokemon = null;
  battleKind = 'wild';
  currentTrainer = null;
  currentZone = 0;
  buildWorld();
  bagOpen = false; bagView = 'items'; pendingStone = null;
  owMessage = ''; owMsgTimer = 0; owLocked = false;
  busy = false; fadeAlpha = 0; evo = null;
  battleState = {};
  particles = [];
  animationQueue = [];
  messageQueue = [];
  currentMessage = '';
  messageTimer = 0;
  isProcessing = false;
  awaitingInput = false;
  gameState = 'title';
}

// --- Resize ---
function resizeCanvas() {
  const container = document.getElementById('game-container');
  const rect = container.getBoundingClientRect();
  canvas.width = 900;
  canvas.height = 562;
}
resizeCanvas();
ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// --- Game loop ---
let lastTime = performance.now();
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;

  owTime += dt;

  animTime += dt;
  if (gameState === 'overworld') { dayTime += dt; updateWeather(dt); updateSparkle(dt); if (shopMsgTimer > 0) { shopMsgTimer -= dt; if (shopMsgTimer <= 0) shopMessage = ''; } }

  // Update animations
  processAnimations(dt);
  updateParticles(dt);

  // Mundo abierto
  if (gameState === 'overworld') {
    updateHero(dt);
    updateCamera(false);
    updateOverworldInput();
    if (owMsgTimer > 0) owMsgTimer -= dt * 1000;
  }

  // Decay effects
  if (shakeAmount > 0) shakeAmount = Math.max(0, shakeAmount - dt * 50);
  if (flashAmount > 0) flashAmount = Math.max(0, flashAmount - dt * 3);

  // Message timer
  if (messageTimer > 0) {
    messageTimer -= dt * 1000;
  } else if (messageQueue.length > 0) {
    currentMessage = messageQueue.shift();
    messageTimer = 1500;
  }

  // Render
  ctx.clearRect(0, 0, W, H);

  if (gameState === 'title') {
    drawTitleScreen(ctx);
  } else if (gameState === 'overworld') {
    drawOverworld(ctx);
  } else if (gameState === 'evolution') {
    drawEvolution(ctx);
  } else if (gameState === 'battle') {
    drawBattleScene(ctx);
    if (awaitingInput && moveMenuOpen) drawMoveMenu(ctx);
    if (awaitingInput && itemMenuOpen) drawItemMenu(ctx);
    if (awaitingInput && pokemonMenuOpen) drawPokemonMenu(ctx);
  } else if (gameState === 'gameover') {
    drawBattleScene(ctx);
    drawEndScreen(ctx, false);
  } else if (gameState === 'victory') {
    drawOverworld(ctx);
    drawEndScreen(ctx, true);
  }

  if (busy) drawBusy(ctx);
  drawFade(ctx);

  requestAnimationFrame(gameLoop);
}

// --- Preload starter sprites ---
async function preload() {
  document.getElementById('loading-text').textContent = 'Cargando Pokémon iniciales...';
  const fill = document.getElementById('loading-fill');

  let loaded = 0;
  const total = STARTER_IDS.length;
  for (const id of STARTER_IDS) {
    await loadSprite(spriteURL(id));
    loaded++;
    fill.style.width = `${(loaded / total) * 100}%`;
  }

  document.getElementById('loading').style.display = 'none';
  battleState = {};
  STONE_KEYS.forEach(k => { player.stones[k] = 0; });
  pendingEvos = [];
  player.berries = 0;
  player.seen = {}; player.caught = {};
  riding = false; dayTime = 60;
  buildWorld();
  gameState = 'title';
  requestAnimationFrame(gameLoop);
}

preload();

    try {
      const computedStyle = getComputedStyle(original);
      // cssText on a computed style is the serialized declaration in modern
      // Chromium/Safari — a single read beats enumerating ~400 longhand
      // properties. Firefox returns "" here, so we fall back on empty.
      const serialized = computedStyle.cssText;
      if (serialized) {
        clone.style.cssText = serialized;
      } else {
        const parts = new Array(computedStyle.length);
        for (let index = 0; index < computedStyle.length; index += 1) {
          const property = computedStyle[index];
          parts[index] = `${property}:${computedStyle.getPropertyValue(property)};`;
        }
        clone.style.cssText = parts.join("");
      }
    } catch (_error) {}

    const originalChildren = original.children;
    const clonedChildren = clone.children;
    for (
      let index = 0;
      index < originalChildren.length && index < clonedChildren.length;
      index += 1
    ) {
      inlineAll(originalChildren[index], clonedChildren[index]);
    }
  }

  function extractFontUrl(srcValue) {
    const matches = [
      ...srcValue.matchAll(
        /url\(["']?([^"')]+)["']?\)(?:\s*format\(["']?([^"')]+)["']?\))?/gi,
      ),
    ];
    if (matches.length === 0) return null;
    const woff2 = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff2"));
    if (woff2) return woff2[1];
    const woff = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff"));
    if (woff) return woff[1];
    return matches[0][1];
  }

  // Cache resolved font URL -> data URI across captures. Fonts on a page
  // essentially never change, and a batch run emits multiple captures back to
  // back — without this we'd refetch + re-base64 every time.
  const fontDataUriCache = new Map();
  const SRC_DECLARATION_RE = /src\s*:\s*[^;}]+/i;

  async function fetchAsDataUri(url) {
    if (fontDataUriCache.has(url)) return fontDataUriCache.get(url);
    let dataUri = null;
    try {
      const response = await fetch(url, { mode: "cors", credentials: "omit" });
      if (response.ok) {
        const blob = await response.blob();
        if (blob.size <= MAX_FONT_BYTES) {
          dataUri = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () =>
              resolve(typeof reader.result === "string" ? reader.result : null);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(blob);
          });
        }
      }
    } catch (_error) {
      dataUri = null;
    }
    fontDataUriCache.set(url, dataUri);
    return dataUri;
  }

  function collectFontFaceRuleTexts() {
    const rules = [];
    for (const sheet of document.styleSheets) {
      let cssRules;
      try {
        cssRules = sheet.cssRules;
      } catch (_error) {
        continue;
      }
      if (!cssRules) continue;
      for (const rule of cssRules) {
        const cssText = rule.cssText || "";
        if (cssText.startsWith("@font-face")) rules.push(cssText);
      }
    }
    return rules;
  }

  async function buildInlinedFontCss() {
    const ruleTexts = collectFontFaceRuleTexts();
    if (ruleTexts.length === 0) return null;

    const resolved = ruleTexts.map((cssText) => {
      if (!SRC_DECLARATION_RE.test(cssText)) return null;
      const srcMatch = cssText.match(/src\s*:\s*([^;}]+)[;}]/i);
      if (!srcMatch) return null;
      const url = extractFontUrl(srcMatch[1]);
      if (!url) return null;
      try {
        return { cssText, url: new URL(url, document.baseURI).href };
      } catch (_error) {
        return null;
      }
    });

    const dataUris = await Promise.all(
      resolved.map((entry) => (entry ? fetchAsDataUri(entry.url) : Promise.resolve(null))),
    );

    const inlined = [];
    let totalBytes = 0;
    for (let index = 0; index < resolved.length; index += 1) {
      const entry = resolved[index];
      const dataUri = dataUris[index];
      if (!entry || !dataUri) continue;
      const approxBytes = dataUri.length * 0.75;
      if (totalBytes + approxBytes > MAX_TOTAL_FONT_BYTES) break;
      totalBytes += approxBytes;
      inlined.push(entry.cssText.replace(SRC_DECLARATION_RE, `src: url("${dataUri}")`));
    }
    return inlined.length > 0 ? inlined.join("\n") : null;
  }

  function stripExternal(clone) {
    const images = clone.querySelectorAll("img");
    for (let index = 0; index < images.length; index += 1) {
      const src = images[index].getAttribute("src");
      if (src && !src.startsWith("data:")) images[index].removeAttribute("src");
    }

    const elements = clone.querySelectorAll("*");
    for (let index = 0; index < elements.length; index += 1) {
      const style = elements[index].style.cssText;
      if (style && style.includes("url(")) {
        elements[index].style.cssText = style.replace(
          /url\(["']?(?!data:)[^)"']*["']?\)/gi,
          "none",
        );
      }
    }
  }

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="position:relative;left:-${scrollX}px;top:-${scrollY}px">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();


</script></body>
</html>
